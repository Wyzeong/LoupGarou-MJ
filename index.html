<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#12142a">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<title>Meneur de Loup-Garou</title>
<style>
:root{--bg:#12142a;--card:#1d2142;--card2:#2a2f5e;--txt:#eceaf6;--mut:#a6a9cc;--acc:#8f9cff;--red:#ff6b81;--green:#4fd08f}
body.jour{--bg:#2a1f14;--card:#3b2c1c;--card2:#523e28;--mut:#d3bd9f;--acc:#f5b041}
*{box-sizing:border-box}
html,body{margin:0}
body{font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--txt);transition:background .4s;-webkit-tap-highlight-color:transparent}
header{position:sticky;top:0;z-index:5;display:flex;align-items:center;gap:6px;padding:10px 12px;padding-top:calc(10px + env(safe-area-inset-top));background:var(--bg);border-bottom:1px solid #ffffff14}
header h1{font-size:1.05rem;margin:0;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ib{background:var(--card2);border:0;color:var(--txt);border-radius:10px;padding:8px 11px;font-size:1rem;cursor:pointer;flex-shrink:0}
main{padding:14px;max-width:640px;margin:0 auto;padding-bottom:120px}
.card{background:var(--card);border-radius:14px;padding:14px;margin-bottom:12px}
h2{margin:.2rem 0 .8rem;font-size:1.45rem}
h3{margin:0 0 .6rem;font-size:.85rem;color:var(--mut);text-transform:uppercase;letter-spacing:.05em}
.phase{color:var(--acc);font-weight:700;font-size:.85rem;text-transform:uppercase;letter-spacing:.08em}
.read{border-left:4px solid var(--acc);background:var(--card2);padding:22px 46px 14px 14px;border-radius:10px;font-size:1.18rem;line-height:1.5;font-style:italic;margin:0 0 12px;position:relative}
.read .lbl{position:absolute;top:6px;left:14px;font-size:.68rem;font-style:normal;text-transform:uppercase;letter-spacing:.08em;color:var(--acc);font-weight:700}
.read .spk{position:absolute;top:8px;right:8px;background:none;border:0;font-size:1.2rem;cursor:pointer}
.tip{color:var(--mut);font-size:.93rem;line-height:1.45;margin:.3rem 0}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chips.center{justify-content:center}
.chip{background:var(--card2);border:2px solid transparent;color:var(--txt);border-radius:999px;padding:10px 14px;font-size:1rem;cursor:pointer;margin:0}
.card>.chip{margin-top:8px}
.chip.sel{background:var(--acc);color:#111;font-weight:700}
.reveal{background:#00000033;border:1px dashed var(--acc);border-radius:10px;padding:12px;margin-top:12px;font-size:1.05rem}
.row{display:flex;align-items:center;gap:8px;padding:9px 0;border-bottom:1px solid #ffffff12}
.row:last-child{border-bottom:0}
.row.mort{opacity:.5}
.grow{flex:1;min-width:0}
.num{width:1.6em;color:var(--mut);text-align:right}
.cnt{min-width:1.6em;text-align:center;font-size:1.1rem}
.q{color:var(--acc);font-size:.85rem}
.tag{font-size:.75rem;color:var(--acc);white-space:nowrap}
select,input{background:var(--card2);color:var(--txt);border:1px solid #ffffff22;border-radius:10px;padding:10px;font-size:1rem;width:100%;margin:4px 0}
.add{display:flex;gap:8px;margin-top:10px}.add input{margin:0}
.chk{display:flex;gap:10px;align-items:flex-start;margin-top:12px;line-height:1.35}
.chk input{width:22px;height:22px;flex-shrink:0;margin:0}
.ok{color:var(--green);font-weight:700}.err{color:var(--red);font-weight:700}
.footer{position:fixed;bottom:0;left:0;right:0;padding:14px;padding-bottom:calc(14px + env(safe-area-inset-bottom));background:linear-gradient(transparent,var(--bg) 35%)}
.btn{display:block;width:100%;max-width:612px;margin:0 auto;border:0;border-radius:14px;padding:17px;font-size:1.12rem;font-weight:700;background:var(--acc);color:#111;cursor:pointer}
.btn:disabled{opacity:.35}
.btn.sec{background:var(--card2);color:var(--txt)}
.big{font-size:3.2rem;font-weight:800;text-align:center;font-variant-numeric:tabular-nums;margin:6px 0 12px}
.win{text-align:center;font-size:1.5rem;font-weight:800;padding:24px 14px}
.sheet{position:fixed;inset:0;background:#000a;z-index:10;display:flex;align-items:flex-end;justify-content:center}
.sheet.hidden{display:none}
.panel{background:var(--bg);width:100%;max-width:640px;max-height:88vh;overflow:auto;border-radius:18px 18px 0 0;padding:18px;padding-bottom:calc(24px + env(safe-area-inset-bottom));position:relative}
.panel .close{position:absolute;top:14px;right:14px}
details{background:var(--card);border-radius:10px;padding:10px 12px;margin:6px 0}
summary{cursor:pointer;font-weight:600}
#toast{position:fixed;left:50%;bottom:100px;transform:translateX(-50%);background:#000d;color:#fff;padding:12px 18px;border-radius:12px;z-index:20;max-width:90vw;text-align:center;opacity:0;transition:opacity .25s;pointer-events:none}
#toast.on{opacity:1}
</style>
</head>
<body>
<header id="top"></header>
<main id="app"></main>
<div id="sheet" class="sheet hidden"></div>
<div id="toast"></div>
<script>
'use strict';
const ROLES={
 loup:{nom:'Loup-Garou',ico:'🐺',max:4,desc:"Chaque nuit, les Loups-Garous se réveillent ensemble et choisissent une victime. Le jour, ils se font passer pour d'innocents villageois."},
 villageois:{nom:'Simple Villageois',ico:'🧑‍🌾',max:13,desc:"Aucun pouvoir. Ses armes : son intuition, sa parole et son vote."},
 voyante:{nom:'Voyante',ico:'🔮',max:1,desc:"Chaque nuit, elle découvre la vraie carte d'un joueur de son choix."},
 sorciere:{nom:'Sorcière',ico:'🧪',max:1,desc:"Elle a deux potions, chacune utilisable une seule fois dans la partie : une potion de vie pour sauver la victime des Loups (elle peut se sauver elle-même) et une potion de mort pour éliminer un joueur. Elle peut utiliser les deux la même nuit."},
 chasseur:{nom:'Chasseur',ico:'🏹',max:1,desc:"Quand il meurt, quelle qu'en soit la cause, il élimine immédiatement un autre joueur de son choix."},
 cupidon:{nom:'Cupidon',ico:'💘',max:1,desc:"La première nuit, il désigne deux amoureux (il peut se choisir lui-même). Si l'un meurt, l'autre meurt aussitôt de chagrin. Si le couple est formé d'un Loup et d'un villageois, son seul but devient d'être les deux derniers survivants."},
 petitefille:{nom:'Petite Fille',ico:'👧',max:1,desc:"Pendant le tour des Loups-Garous, elle peut entrouvrir les yeux pour les espionner. Si un Loup la surprend, elle meurt à la place de la victime désignée."},
 voleur:{nom:'Voleur',ico:'🃏',max:1,desc:"On distribue 2 cartes de plus que de joueurs (en général 2 Simples Villageois en plus) : les 2 cartes restantes sont posées face cachée au centre. La première nuit, le Voleur peut échanger sa carte contre l'une d'elles. S'il y a 2 Loups-Garous au centre, il est obligé d'en prendre un."}
};
const CAP="Élu par le village le premier jour. Son vote compte double. S'il meurt, il désigne immédiatement son successeur.";
const VICT="🏡 Le village gagne quand tous les Loups-Garous sont morts.<br>🐺 Les Loups-Garous gagnent quand tous les autres joueurs sont morts.<br>💘 Si les Amoureux sont un Loup et un villageois, ils gagnent seulement s'ils sont les deux derniers survivants.<br><br>Astuce : si les Loups sont aussi nombreux que les villageois et que l'issue est évidente, tu peux arrêter la partie plus tôt.";
const ORDER=Object.keys(ROLES);
const KEY='lgmj_state_v1',NKEY='lgmj_noms_v1',VKEY='lgmj_voix';
let HIST=[];
let voix=localStorage.getItem(VKEY)==='1';

function fresh(){let noms=[];try{noms=JSON.parse(localStorage.getItem(NKEY))||[]}catch(e){}
 return {phase:'setup',noms,comp:null,compPerso:false,capitaine:true,players:[],cycle:'nuit',num:1,steps:[],idx:0,out:[],cap:null,witch:{vie:true,mort:true},nuit:{victime:null,sauvee:false,poison:null},queue:[],log:[],ready:false,winner:null,tmp:{}}}
function load(){try{return JSON.parse(localStorage.getItem(KEY))}catch(e){return null}}
let S=load()||fresh();
function save(){try{localStorage.setItem(KEY,JSON.stringify(S));localStorage.setItem(NKEY,JSON.stringify(S.noms))}catch(e){}}
function snap(){HIST.push(JSON.stringify(S));if(HIST.length>60)HIST.shift()}
function undo(){if(!HIST.length){toast('Rien à annuler');return}S=JSON.parse(HIST.pop());save();closeSheet();render();toast('Dernière action annulée')}

const $=s=>document.querySelector(s);
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const P=id=>S.players.find(p=>p.id===id);
const nm=id=>{const p=P(id);return p?esc(p.nom):'?'};
const vivants=()=>S.players.filter(p=>p.alive);
const enJeu=r=>(S.comp[r]||0)-S.out.filter(x=>x===r).length;
const porteurs=r=>S.players.filter(p=>p.role===r);
const pris=()=>S.players.filter(p=>p.role).map(p=>p.id);
const rn=r=>r?ROLES[r].ico+' '+ROLES[r].nom:'❓ Inconnu';
const n1=()=>S.num===1&&!S.ready;
function actif(r){if(n1())return enJeu(r)>0;return S.players.some(p=>p.alive&&p.role===r)}
function log(t){S.log.push({c:(S.cycle==='nuit'?'🌙 Nuit ':'☀️ Jour ')+S.num,t})}
function toast(m){const t=$('#toast');t.textContent=m;t.classList.add('on');clearTimeout(t._t);t._t=setTimeout(()=>t.classList.remove('on'),2600)}

/* ---------- composants ---------- */
function dire(t){return `<div class="read"><span class="lbl">À dire</span><span class="t">${t}</span><button class="spk" onclick="speak(this.parentElement.querySelector('.t').innerText)" aria-label="Lire">🔊</button></div>`}
function speak(t){if(!('speechSynthesis' in window))return;speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(t);u.lang='fr-FR';u.rate=.95;speechSynthesis.speak(u)}
function picker(f,o={}){const multi=!!o.multi,max=o.max||1,ex=o.exclude||[];
 const list=(o.list||vivants()).filter(p=>!ex.includes(p.id));const cur=S.tmp[f];
 if(!list.length)return '<p class="tip">Aucun joueur disponible.</p>';
 return '<div class="chips">'+list.map(p=>{const sel=multi?(cur||[]).includes(p.id):cur===p.id;
  return `<button class="chip${sel?' sel':''}" onclick="pk('${f}',${p.id},${multi},${max})">${esc(p.nom)}</button>`}).join('')+'</div>'}
function pk(f,id,multi,max){if(multi){let a=(S.tmp[f]||[]).slice();if(a.includes(id))a=a.filter(x=>x!==id);else{a.push(id);if(a.length>max)a.shift()}S.tmp[f]=a}
 else S.tmp[f]=S.tmp[f]===id?null:id;save();render()}
function setT(k,v){S.tmp[k]=v;save();render()}

/* ---------- déroulé ---------- */
const NUIT=['n_ambiance','n_intro','n_voleur','n_reperage','n_cupidon','n_amoureux','n_voyante','n_loups','n_sorciere','n_fin'];
const JOUR=['d_reveil','d_election','d_debat','d_vote','d_fin'];
const ST={};
const REPERE={chasseur:"Chasseur, lève discrètement le pouce, sans ouvrir les yeux… Sache que ton fusil ne te quitte jamais, même dans ton sommeil : si tu viens à mourir, quelle qu'en soit la raison, tu auras encore la force de tirer une dernière balle et d'emporter quelqu'un avec toi dans la tombe. Tu peux baisser le pouce.",petitefille:"Petite Fille, lève discrètement le pouce, sans ouvrir les yeux… Toi, la curieuse du village, quand les Loups-Garous se réveilleront, tu pourras entrouvrir les yeux pour les espionner. Mais prends garde : s'ils te surprennent, c'est toi qu'ils dévoreront à la place de leur victime. Tu peux baisser le pouce."};
const aReperer=()=>['chasseur','petitefille'].filter(r=>enJeu(r)>0&&!porteurs(r).length);
function mortsNuit(){const m=[],n=S.nuit;if(n.victime!=null&&!n.sauvee)m.push(n.victime);if(n.poison!=null&&!m.includes(n.poison))m.push(n.poison);return m}

ST.n_ambiance={cond:()=>S.num===1&&!S.ready,titre:()=>'Il était une fois Thiercelieux…',btn:'Le village s\'endort →',
 html:()=>`<div class="card tip">🕯️ Baisse la lumière si tu peux. Parle lentement, à voix basse, et marque bien les pauses (…).</div>`+
 dire("Bienvenue à Thiercelieux, un petit village perdu au creux de la forêt, loin de tout.<br><br>Depuis plusieurs nuits, d'étranges bruits troublent le sommeil des villageois : des grattements contre les volets… des pas lourds dans la boue… et, au loin, des hurlements qui glacent le sang.<br><br>Le vieux berger a été retrouvé un matin, à l'orée du bois… ou du moins, ce qu'il en restait. Puis ce fut le tour de la fille du meunier. Les traces autour de son corps ne ressemblaient à celles d'aucune bête connue.<br><br>Les anciens murmurent une vieille légende : certains d'entre nous, la nuit venue, ne seraient plus tout à fait humains.<br><br>Ce soir, la lune est pleine. Regardez bien vos voisins… car parmi vous, assis à cette table, se cachent des Loups-Garous.<br><br>Le jour, ils vous sourient. La nuit, ils chassent.<br><br>Votre seule chance de survie : les démasquer… avant qu'il ne soit trop tard.")};

ST.n_intro={titre:()=>'La nuit tombe',btn:'Commencer la nuit',
 html:()=>dire(S.num===1?"La nuit tombe sur Thiercelieux. Les volets se ferment, les bougies s'éteignent une à une… Tout le village s'endort. Fermez les yeux et baissez la tête.":"La nuit retombe sur Thiercelieux. Les volets se ferment, les bougies s'éteignent… Tout le village s'endort. Fermez les yeux.")+
 `<div class="card tip">• Vérifie que tout le monde a bien les yeux fermés.<br>• Astuce : tapote doucement la table pendant toute la nuit pour couvrir les bruits et les mouvements.<br>• Garde le même ton de voix pour chaque rôle.</div>`};

ST.n_voleur={cond:()=>n1()&&(S.comp.voleur||0)>0,titre:()=>'Le Voleur',btn:'Valider',
 html:()=>{const t=S.tmp;const opts=k=>ORDER.filter(x=>S.comp[x]>0).map(x=>`<option value="${x}" ${t[k]===x?'selected':''}>${rn(x)}</option>`).join('');
  let h=dire("Voleur, réveille-toi. Toi qui vis de larcins et de mauvais coups, cette nuit le hasard t'offre une chance unique : au centre de la table reposent deux cartes oubliées. Tu peux échanger ta propre identité contre l'une d'elles… ou garder la tienne. Mais prends garde : si deux Loups-Garous t'attendent au centre, la malédiction est trop forte et tu devras en prendre un. Ton choix est définitif : tu deviendras ce que tu as volé.");
  h+=`<div class="card"><h3>1. Cartes du centre</h3><p class="tip">Regarde discrètement les 2 cartes du centre :</p><select onchange="setT('c1',this.value)"><option value="">Carte 1…</option>${opts('c1')}</select><select onchange="setT('c2',this.value)"><option value="">Carte 2…</option>${opts('c2')}</select></div>`;
  h+=`<div class="card"><h3>2. Qui est le Voleur ?</h3>${picker('vol')}<button class="chip ${t.vol===-1?'sel':''}" onclick="pk('vol',-1,false,1)">Personne (le Voleur est au centre)</button></div>`;
  if(t.vol!=null&&t.vol!==-1&&t.c1&&t.c2){h+=`<div class="card"><h3>3. Son choix</h3><div class="chips">`+[['garder','Garde sa carte'],['c1','Prend '+rn(t.c1)],['c2','Prend '+rn(t.c2)]].map(([v,l])=>`<button class="chip ${t.ch===v?'sel':''}" onclick="setT('ch','${v}')">${l}</button>`).join('')+'</div>'+(t.c1==='loup'&&t.c2==='loup'?'<p class="tip">⚠️ Deux Loups au centre : il est obligé d\'en prendre un.</p>':'')+'<p class="tip">S\'il échange, il prend la carte choisie et pose la sienne au centre.</p></div>'}
  return h+dire("Voleur, rendors-toi… avec ta nouvelle vie entre les mains.")},
 next:()=>{const t=S.tmp;if(!t.c1||!t.c2)return 'Indique les 2 cartes du centre.';if(t.vol==null)return 'Indique qui est le Voleur.';
  const c=[t.c1,t.c2];for(const r of ORDER)if(c.filter(x=>x===r).length>(S.comp[r]||0))return 'Ces 2 cartes ne correspondent pas à la composition.';
  if(t.vol===-1){if(!c.includes('voleur'))return "Si personne n'est Voleur, l'une des cartes du centre doit être le Voleur.";S.out=c;log('Le Voleur était au centre. Hors jeu : '+c.map(x=>ROLES[x].nom).join(', ')+'.');return}
  if(c.includes('voleur'))return "Le Voleur est un joueur : il ne peut pas aussi être au centre.";
  if(!t.ch)return 'Indique le choix du Voleur.';
  if(t.ch==='garder'&&t.c1==='loup'&&t.c2==='loup')return 'Avec 2 Loups au centre, il doit en prendre un.';
  const p=P(t.vol);
  if(t.ch==='garder'){p.role='voleur';S.out=c;log(p.nom+' (Voleur) garde sa carte.')}
  else{const pr=t[t.ch],au=t.ch==='c1'?t.c2:t.c1;p.role=pr;S.out=['voleur',au];log(`${p.nom} (Voleur) prend la carte ${ROLES[pr].nom}.`)}}};

ST.n_reperage={cond:()=>n1()&&aReperer().length>0,titre:()=>'Repérage discret',btn:'Continuer',
 html:()=>`<p class="tip">Ces rôles ne se réveillent jamais la nuit. Pour savoir qui les a, demande-leur de lever le pouce, yeux fermés. <i>(Habitude courante de meneur, pas une règle officielle.)</i></p>`+
  aReperer().map(r=>dire(REPERE[r])+`<div class="card"><h3>${rn(r)}</h3>${picker('rp_'+r,{exclude:pris()})}</div>`).join(''),
 next:()=>{const rs=aReperer(),ids=rs.map(r=>S.tmp['rp_'+r]);for(let i=0;i<rs.length;i++)if(ids[i]==null)return 'Indique qui est '+ROLES[rs[i]].nom+'.';
  if(new Set(ids).size!==ids.length)return 'Un même joueur ne peut pas avoir deux rôles.';rs.forEach((r,i)=>P(ids[i]).role=r)}};

ST.n_cupidon={cond:()=>n1()&&enJeu('cupidon')>0,titre:()=>'Cupidon',btn:'Valider',
 html:()=>{const c=porteurs('cupidon')[0];return dire("Cupidon, réveille-toi. Petit ange malicieux, tu tiens entre tes mains l'arc de l'amour éternel. Cette nuit, tu vas décocher deux flèches et unir deux âmes pour toujours, pour le meilleur… et surtout pour le pire. Tu peux même te choisir toi-même. Désigne les deux joueurs qui tomberont amoureux.")+
  (c?`<p class="tip">Cupidon : <b>${esc(c.nom)}</b></p>`:`<div class="card"><h3>Qui est Cupidon ?</h3>${picker('cup',{exclude:pris()})}</div>`)+
  `<div class="card"><h3>Les 2 amoureux</h3><p class="tip">Cupidon peut se choisir lui-même.</p>${picker('am',{multi:true,max:2})}</div>`+dire("Ta mission est accomplie, Cupidon. Range ton arc, rendors-toi… et redeviens un simple habitant de Thiercelieux.")},
 next:()=>{const c=porteurs('cupidon')[0];if(!c&&S.tmp.cup==null)return 'Indique qui est Cupidon.';const a=S.tmp.am||[];if(a.length!==2)return 'Choisis exactement 2 amoureux.';
  if(!c)P(S.tmp.cup).role='cupidon';a.forEach(id=>P(id).lover=true);log(`Cupidon a uni ${P(a[0]).nom} et ${P(a[1]).nom}.`)}};

ST.n_amoureux={cond:()=>n1()&&S.players.some(p=>p.lover),titre:()=>'Les Amoureux',btn:'Continuer',
 html:()=>{const a=S.players.filter(p=>p.lover);return dire("Je vais toucher la tête des deux amoureux…")+
  `<div class="card tip">👉 Fais le tour de la table et touche la tête de <b>${esc(a[0].nom)}</b> et de <b>${esc(a[1].nom)}</b>.</div>`+
  dire("Amoureux, ouvrez les yeux et regardez-vous. La flèche de Cupidon vous a frappés en plein cœur : désormais, vos deux destins n'en font plus qu'un. Si l'un de vous venait à mourir, l'autre, le cœur brisé, le suivrait aussitôt dans la tombe. Jamais vous ne pourrez voter l'un contre l'autre. Et si l'un de vous est un Loup-Garou et l'autre un villageois… alors plus rien ne compte que votre amour : pour triompher, vous devrez être les deux derniers survivants du village. Gardez précieusement votre secret… et rendormez-vous.")}};

ST.n_voyante={cond:()=>actif('voyante'),titre:()=>'La Voyante',btn:'Valider',
 html:()=>{const v=porteurs('voyante')[0],vid=v?v.id:S.tmp.voy;let h=dire(n1()?"Voyante, réveille-toi. Toi qui lis dans les âmes comme d'autres lisent dans les livres… Chaque nuit, ta boule de cristal te révélera la véritable nature d'un habitant du village. Désigne le joueur dont tu veux percer le secret.":"Voyante, réveille-toi. Ta boule de cristal s'éclaire à nouveau dans l'obscurité… Quel secret veux-tu percer cette nuit ?");
  h+=v?`<p class="tip">Voyante : <b>${esc(v.nom)}</b></p>`:`<div class="card"><h3>Qui est la Voyante ?</h3>${picker('voy',{exclude:pris()})}</div>`;
  h+=`<div class="card"><h3>Joueur désigné</h3>${picker('cible',{exclude:vid!=null?[vid]:[]})}`;
  if(S.tmp.cible!=null){const c=P(S.tmp.cible);h+=`<div class="reveal">👉 Prends la carte de <b>${esc(c.nom)}</b>, montre-la à la Voyante sans bruit, puis repose-la face cachée.${c.role?`<br>Pour info : c'est <b>${rn(c.role)}</b>.`:''}</div>`}
  return h+'</div>'+dire("Garde précieusement ce que tu as vu, Voyante… et rendors-toi.")},
 next:()=>{const v=porteurs('voyante')[0];if(!v&&S.tmp.voy==null)return 'Indique qui est la Voyante.';if(S.tmp.cible==null)return 'Indique le joueur désigné par la Voyante.';

function vt(id,d){const v=S.tmp.votes;v[id]=Math.max(0,(v[id]||0)+d);
 const e=Object.entries(v).filter(x=>x[1]>0),mx=Math.max(0,...e.map(x=>x[1])),top=e.filter(x=>x[1]===mx);
 if(mx>0&&top.length===1)S.tmp.elim=+top[0][0];else if(top.length>1)S.tmp.elim=null;save();render()}

function startNuit(n){S.cycle='nuit';S.num=n;S.steps=NUIT;S.idx=0;S.tmp={};S.nuit={victime:null,sauvee:false,poison:null}}
function startJour(){S.cycle='jour';S.steps=JOUR;S.idx=0;S.tmp={}}
function enfile(id,cause){const p=P(id);if(!p||!p.alive||S.queue.some(q=>q.id===id))return;S.queue.push({id,cause})}

function go(){const st=ST[S.steps[S.idx]],bak=JSON.stringify(S);const r=st.next?st.next():undefined;
 if(typeof r==='string'&&r!=='GOTO'){S=JSON.parse(bak);toast(r);return}
 HIST.push(bak);if(HIST.length>60)HIST.shift();
 if(r!=='GOTO'){S.idx++;S.tmp={}}save();window.scrollTo(0,0);render()}

/* ---------- morts ---------- */
const CAUSES={nuit:'mort(e) cette nuit',loups:'mort(e) cette nuit',poison:'mort(e) cette nuit',vote:'éliminé(e) par le village',chasseur:'abattu(e) par le Chasseur',chagrin:'mort(e) de chagrin'};
function partenaire(p){return p.lover?S.players.find(x=>x.lover&&x.id!==p.id):null}
let recit=localStorage.getItem('lgmj_recit')==='1';
function recitMort(n,c){const fin=` ${n}, retourne ta carte : qui étais-tu vraiment ?`;
 if((c==='loups'||c==='poison')&&!recit)c='nuit';
 return {nuit:`Au petit matin, on découvre le corps sans vie de ${n}. La nuit a fait une nouvelle victime…`,
  loups:`À l'aube, on découvre le corps de ${n} au bord du chemin, lacéré de profondes griffures, au milieu d'empreintes énormes. Les Loups-Garous ont encore frappé…`,
  poison:`${n} ne s'est jamais réveillé(e). On l'a retrouvé(e) dans son lit, sans la moindre égratignure, le teint livide et les lèvres noircies… Un poison foudroyant.`,
  vote:`Le village a rendu son verdict. Malgré ses protestations, ${n} est conduit(e) jusqu'au grand chêne de la place, sous le regard de ceux qui furent ses voisins…`,
  chasseur:`Un coup de feu déchire le silence ! ${n} s'effondre, touché(e) par la dernière balle du Chasseur.`,
  chagrin:`En voyant s'éteindre l'être aimé, le cœur de ${n} se brise. Incapable de vivre sans l'autre, ${n} s'effondre à son tour, emporté(e) par le chagrin.`}[c]+fin}
function htmlMort(){const q=S.queue[0],p=P(q.id),r=S.tmp.mr||p.role,a=partenaire(p);
 const ex=S.queue.map(x=>x.id);if(a&&a.alive)ex.push(a.id);
 let h=`<div class="phase">${S.cycle==='nuit'?'🌙 Nuit':'☀️ Jour'} ${S.num}</div><h2>☠️ ${esc(p.nom)}</h2>`+dire(recitMort(esc(p.nom),q.cause));
 h+=`<div class="card"><h3>Carte révélée</h3><select onchange="setT('mr',this.value)">${ORDER.map(x=>`<option value="${x}" ${x===r?'selected':''}>${rn(x)}</option>`).join('')}</select><p class="tip">Corrige ici si la carte retournée n'est pas celle notée.</p></div>`;
 if(r==='chasseur')h+=dire("Chasseur, tu sens la vie te quitter… mais dans un dernier effort, tu épaules ton fusil. Désigne celui ou celle que tu emportes avec toi dans la tombe.")+`<div class="card"><h3>Cible du Chasseur</h3>${picker('tir',{exclude:S.queue.map(x=>x.id)})}</div>`;
 if(a&&a.alive&&!S.queue.some(x=>x.id===a.id))h+=`<div class="reveal">💔 ${esc(p.nom)} était amoureux(se) de <b>${esc(a.nom)}</b>, qui va mourir de chagrin.</div>`;
 if(S.capitaine&&S.cap===p.id&&vivants().some(x=>!ex.includes(x.id)))h+=dire("Capitaine, avant de rendre ton dernier souffle, tu tends l'insigne du village à celui ou celle qui le guidera après toi. Désigne ton successeur.")+`<div class="card" style="margin-top:12px"><h3>Nouveau Capitaine</h3>${picker('succ',{exclude:ex})}</div>`;
 return h}
function confirmMort(){const q=S.queue[0],p=P(q.id),r=S.tmp.mr||p.role,a=partenaire(p);
 const ex=S.queue.map(x=>x.id);if(a&&a.alive)ex.push(a.id);
 if(r==='chasseur'&&S.tmp.tir==null&&vivants().some(x=>!S.queue.some(y=>y.id===x.id)))return toast('Le Chasseur doit désigner sa cible.');
 if(S.capitaine&&S.cap===p.id&&S.tmp.succ==null&&vivants().some(x=>!ex.includes(x.id)))return toast('Désigne le nouveau Capitaine.');
 snap();p.role=r;p.alive=false;S.queue.shift();log(`${p.nom} meurt (${CAUSES[q.cause]}) : ${ROLES[r].nom}.`);
 if(a&&a.alive)enfile(a.id,'chagrin');
 if(r==='chasseur'&&S.tmp.tir!=null){log(`Le Chasseur abat ${P(S.tmp.tir).nom}.`);enfile(S.tmp.tir,'chasseur')}
 if(S.cap===p.id){S.cap=S.tmp.succ!=null?S.tmp.succ:null;if(S.cap!=null)log(`${P(S.cap).nom} devient Capitaine.`)}
 S.tmp.mr=null;S.tmp.tir=null;S.tmp.succ=null;save();window.scrollTo(0,0);render()}

function gagnant(){if(!S.ready)return null;const al=vivants();if(!al.length)return 'personne';
 const am=S.players.filter(p=>p.lover),mixte=am.length===2&&((am[0].role==='loup')!==(am[1].role==='loup'));
 if(mixte&&al.length===2&&al.every(p=>p.lover))return 'amoureux';
 const l=al.filter(p=>p.role==='loup').length;if(!l)return 'village';if(l===al.length)return 'loups';return null}
const WIN={village:['🏡','Le village a gagné !',"Le dernier Loup-Garou est tombé. Pour la première fois depuis bien longtemps, les hurlements se sont tus… Thiercelieux peut enfin dormir en paix. Le village a gagné !"],
 loups:['🐺','Les Loups-Garous ont gagné !',"Le dernier villageois s'est effondré. Il ne reste plus à Thiercelieux que des maisons vides… et des Loups-Garous repus qui hurlent à la pleine lune. Les Loups-Garous ont gagné !"],
 amoureux:['💘','Les Amoureux ont gagné !',"Seuls au milieu du village désert, les deux amoureux se tiennent la main. Ils ont tout sacrifié, trahi les leurs… mais leur amour a survécu à tout. Les Amoureux ont gagné !"],
 personne:['💀','Personne ne survit…',"Le silence est retombé sur Thiercelieux. Il n'y a plus personne pour raconter ce qui s'est passé ici…"]};

/* ---------- minuteur ---------- */
let T={dur:180,reste:180,run:false,iv:null};
const tm=()=>Math.floor(T.reste/60)+':'+String(T.reste%60).padStart(2,'0');
function htmlTimer(){return `<div class="card"><h3>Minuteur (facultatif)</h3><div id="tm" class="big">${tm()}</div><div class="chips center">${[2,3,5].map(x=>`<button class="chip ${T.dur===x*60?'sel':''}" onclick="tSet(${x})">${x} min</button>`).join('')}<button class="chip" onclick="tGo()">${T.run?'⏸ Pause':'▶ Lancer'}</button><button class="chip" onclick="tSet(T.dur/60)">↺</button></div></div>`}
function tSet(x){clearInterval(T.iv);T={dur:x*60,reste:x*60,run:false,iv:null};render()}
function tGo(){if(T.run){clearInterval(T.iv);T.run=false}else if(T.reste>0){T.run=true;T.iv=setInterval(()=>{T.reste--;const e=$('#tm');if(e)e.textContent=tm();
 if(T.reste<=0){clearInterval(T.iv);T.run=false;if(navigator.vibrate)navigator.vibrate([300,100,300]);speak('Fin du temps de débat !');render()}},1000)}render()}

/* ---------- préparation ---------- */
function suggest(n){const c={};ORDER.forEach(r=>c[r]=0);c.loup=n<=6?1:n<=11?2:n<=17?3:4;
 [['voyante',4],['sorciere',7],['chasseur',8],['cupidon',9],['petitefille',11]].forEach(([r,m])=>{if(n>=m)c[r]=1});
 const u=ORDER.reduce((a,r)=>a+c[r],0);c.villageois=Math.max(0,Math.min(13,n-u));return c}
function addNom(e){e.preventDefault();const i=$('#nn'),v=i.value.trim();if(!v)return;S.noms.push(v);if(!S.compPerso)S.comp=suggest(S.noms.length);save();render();setTimeout(()=>{const x=$('#nn');if(x)x.focus()},0)}
function rmNom(i){S.noms.splice(i,1);if(!S.compPerso)S.comp=suggest(S.noms.length);save();render()}
function mvNom(i,d){const j=i+d;if(j<0||j>=S.noms.length)return;[S.noms[i],S.noms[j]]=[S.noms[j],S.noms[i]];save();render()}
function cp(r,d){S.comp[r]=Math.max(0,Math.min(ROLES[r].max,(S.comp[r]||0)+d));S.compPerso=true;save();render()}
function sugg(){S.comp=suggest(S.noms.length);S.compPerso=false;save();render()}
function htmlSetup(){const n=S.noms.length;if(!S.comp)S.comp=suggest(n);
 const tot=ORDER.reduce((a,r)=>a+(S.comp[r]||0),0),att=n+(S.comp.voleur?2:0);
 let h=`<div class="card tip">👋 L'appli te guide pas à pas : les encadrés <b>« À dire »</b> sont à lire à voix haute, le reste est pour toi seul. Touche les prénoms pour noter ce qui se passe.</div>`;
 h+=`<div class="card"><h3>Joueurs (${n})</h3><p class="tip">Entre-les dans l'ordre où ils sont assis. Le meneur ne joue pas.</p>`+S.noms.map((x,i)=>`<div class="row"><span class="num">${i+1}</span><span class="grow">${esc(x)}</span><button class="ib" onclick="mvNom(${i},-1)">↑</button><button class="ib" onclick="rmNom(${i})">✕</button></div>`).join('')+
  `<form class="add" onsubmit="addNom(event)"><input id="nn" placeholder="Prénom" autocomplete="off" enterkeyhint="done"><button class="ib">Ajouter</button></form></div>`;
 h+=`<div class="card"><h3>Composition</h3><button class="chip" onclick="sugg()">✨ Suggestion pour ${n} joueurs</button><div style="margin-top:8px"></div>`+
  ORDER.map(r=>`<div class="row"><span class="grow" onclick="sheet('aide:${r}')">${rn(r)} <span class="q">ⓘ</span></span><button class="ib" onclick="cp('${r}',-1)">−</button><b class="cnt">${S.comp[r]||0}</b><button class="ib" onclick="cp('${r}',1)">+</button></div>`).join('')+
  `<label class="chk"><input type="checkbox" ${S.capitaine?'checked':''} onchange="S.capitaine=this.checked;save()"> ⭐ Élire un Capitaine (vote double)</label>`+
  `<p class="${tot===att?'ok':'err'}">Cartes : ${tot} / ${att}${S.comp.voleur?' (joueurs + 2 pour le Voleur)':''}</p></div>`;
 let pb='';if(n<5)pb='Il faut au moins 5 joueurs (la boîte est prévue pour 8 à 18).';else if(!S.comp.loup)pb='Il faut au moins un Loup-Garou.';else if(tot!==att)pb='Ajuste la composition pour avoir '+att+' cartes.';
 if(pb)h+=`<p class="tip" style="text-align:center">${pb}</p>`;
 return {h,ok:!pb}}
function startPartie(){snap();S.players=S.noms.map((nom,i)=>({id:i,nom,role:null,alive:true,lover:false}));
 Object.assign(S,{phase:'distrib',out:[],cap:null,witch:{vie:true,mort:true},queue:[],log:[],ready:false,winner:null,tmp:{}});save();window.scrollTo(0,0);render()}
function htmlDistrib(){return `<h2>Distribution</h2><div class="card"><h3>1. Prépare le paquet</h3>${ORDER.filter(r=>S.comp[r]).map(r=>`<div class="row"><span class="grow">${rn(r)}</span><b>× ${S.comp[r]}</b></div>`).join('')}${S.capitaine?'<p class="tip">Garde la carte ⭐ Capitaine de côté : elle ira au joueur élu.</p>':''}</div>
 <div class="card tip"><h3>2. Distribue</h3>Mélange et donne une carte face cachée à chaque joueur.${S.comp.voleur?' Pose les <b>2 cartes restantes</b> face cachée au centre de la table (pour le Voleur).':''}
 <h3 style="margin-top:14px">3. Découverte</h3>Chacun regarde sa carte en secret, puis la repose face cachée devant lui.
 <h3 style="margin-top:14px">4. Rappelle les règles d'or</h3>On ne montre jamais sa carte. Un mort ne parle plus. La nuit, on garde les yeux fermés.</div>`}
function debut(){snap();S.phase='game';startNuit(1);save();garderEcran();window.scrollTo(0,0);render()}
function nouvelle(){const k={noms:S.noms,comp:S.comp,compPerso:S.compPerso,capitaine:S.capitaine};clearInterval(T.iv);S=Object.assign(fresh(),k);HIST=[];save();closeSheet();window.scrollTo(0,0);render()}
function htmlFin(){const w=WIN[S.winner];return `<div class="card win"><div style="font-size:3.5rem">${w[0]}</div>${w[1]}</div>`+dire(w[2])+
 `<div class="card"><h3>Les rôles</h3>${S.players.map(p=>`<div class="row ${p.alive?'':'mort'}"><span class="grow"><b>${esc(p.nom)}</b> ${p.lover?'💘':''}${S.cap===p.id?'⭐':''}</span><span>${rn(p.role)}</span><span>${p.alive?'❤️':'☠️'}</span></div>`).join('')}</div>`+
 `<details><summary>📜 Journal de la partie</summary>${S.log.map(l=>`<p class="tip"><span class="tag">${l.c}</span> ${esc(l.t)}</p>`).join('')}</details>`}

/* ---------- rendu ---------- */
let lastK='';
function render(){
 if(S.phase==='game'&&!S.queue.length){const w=gagnant();if(w){S.phase='fin';S.winner=w;log('Fin de partie : '+WIN[w][1]);save()}}
 document.body.className=S.phase==='game'?S.cycle:'';renderTop();
 let h='',btn=null,act='',dis=false;
 if(S.phase==='setup'){const r=htmlSetup();h=r.h;btn='Distribuer les cartes →';act='startPartie()';dis=!r.ok}
 else if(S.phase==='distrib'){h=htmlDistrib();btn='🌙 Commencer la nuit 1';act='debut()'}
 else if(S.phase==='fin'){h=htmlFin();btn='🔁 Nouvelle partie';act='nouvelle()'}
 else if(S.queue.length){h=htmlMort();btn='Confirmer';act='confirmMort()'}
 else{while(S.idx<S.steps.length-1){const st=ST[S.steps[S.idx]];if(!st.cond||st.cond())break;S.idx++}
  const st=ST[S.steps[S.idx]];h=`<div class="phase">${S.cycle==='nuit'?'🌙 Nuit':'☀️ Jour'} ${S.num}</div><h2>${st.titre()}</h2>`+st.html();btn=st.btn||'Suivant';act='go()'}
 $('#app').innerHTML=h+(btn?`<div class="footer"><button class="btn" onclick="${act}" ${dis?'disabled':''}>${btn}</button></div>`:'');
 if(voix){const k=S.phase+S.cycle+S.num+'-'+S.idx+'-'+S.queue.length;if(k!==lastK){lastK=k;const r=document.querySelector('#app .read .t');if(r)speak(r.innerText)}}
}
function renderTop(){const g=S.phase==='game'||S.phase==='fin';
 $('#top').innerHTML=`<h1>${S.phase==='game'?(S.cycle==='nuit'?'🌙 Nuit ':'☀️ Jour ')+S.num:'🐺 Meneur de Loup-Garou'}</h1>`+
 (g?`<button class="ib" onclick="sheet('joueurs')" aria-label="Joueurs">👥</button><button class="ib" onclick="sheet('journal')" aria-label="Journal">📜</button>`:'')+
 (S.phase!=='setup'?`<button class="ib" onclick="undo()" aria-label="Annuler">↶</button>`:'')+`<button class="ib" onclick="sheet('menu')" aria-label="Menu">☰</button>`}

function sheet(k){const s=$('#sheet');let h='';
 if(k==='joueurs'){h='<h2>Joueurs</h2><p class="tip">Vue réservée au meneur. Corrige ici un rôle ou un état en cas d\'erreur.</p>'+S.players.map(p=>`<div class="row ${p.alive?'':'mort'}"><span class="grow"><b>${esc(p.nom)}</b> ${p.lover?'💘':''}${S.cap===p.id?'⭐':''}<select onchange="setRole(${p.id},this.value)"><option value="">❓ Inconnu</option>${ORDER.map(r=>`<option value="${r}" ${p.role===r?'selected':''}>${rn(r)}</option>`).join('')}</select></span><button class="ib" onclick="togVie(${p.id})">${p.alive?'❤️':'☠️'}</button></div>`).join('')+
  `<p class="tip" style="margin-top:12px">🧪 Potions de la Sorcière : vie ${S.witch.vie?'✅':'❌'} · mort ${S.witch.mort?'✅':'❌'}</p>`+(S.out.length?`<p class="tip">🃏 Hors jeu (centre) : ${S.out.map(rn).join(', ')}</p>`:'')}
 else if(k==='journal')h='<h2>Journal</h2>'+(S.log.length?S.log.slice().reverse().map(l=>`<div class="row"><span class="tag">${l.c}</span><span class="grow">${esc(l.t)}</span></div>`).join(''):'<p class="tip">Rien pour l\'instant.</p>');
 else if(k.startsWith('aide:')){const r=k.slice(5);h=`<h2>${rn(r)}</h2><p>${ROLES[r].desc}</p>`}
 else h=`<h2>Menu</h2><label class="chk"><input type="checkbox" ${voix?'checked':''} onchange="voix=this.checked;localStorage.setItem(VKEY,voix?'1':'0')"> 🔊 Lire automatiquement les textes « À dire » (voix du téléphone)</label><label class="chk"><input type="checkbox" ${recit?'checked':''} onchange="recit=this.checked;localStorage.setItem('lgmj_recit',recit?'1':'0')"> 🩸 Récits de mort détaillés : on entend si la victime a été dévorée ou empoisonnée (plus immersif, mais donne un indice au village)</label><h3 style="margin-top:18px">Aide-mémoire des rôles</h3>`+
  ORDER.map(r=>`<details><summary>${rn(r)}</summary><p class="tip">${ROLES[r].desc}</p></details>`).join('')+`<details><summary>⭐ Capitaine</summary><p class="tip">${CAP}</p></details><details><summary>🏆 Victoire</summary><p class="tip">${VICT}</p></details>`+
  `<details><summary>🌙 Ordre d'appel de la nuit</summary><p class="tip">1ʳᵉ nuit seulement : Voleur → Cupidon → Amoureux.<br>Chaque nuit : Voyante → Loups-Garous → Sorcière.</p></details>`+
  (S.phase!=='setup'?`<button class="btn sec" style="margin-top:16px" onclick="abandon(this)">🔁 Abandonner / nouvelle partie</button>`:'');
 s.innerHTML=`<div class="panel"><button class="ib close" onclick="closeSheet()">✕</button>${h}</div>`;s.classList.remove('hidden');s.dataset.k=k}
function abandon(b){if(b.dataset.ok){nouvelle();return}b.dataset.ok=1;b.textContent='⚠️ Touche encore pour confirmer l\'abandon';b.style.background='var(--red)';b.style.color='#111'}
function closeSheet(){$('#sheet').classList.add('hidden')}
$('#sheet').addEventListener('click',e=>{if(e.target.id==='sheet')closeSheet()});
function setRole(id,r){snap();P(id).role=r||null;save();render();sheet('joueurs')}
function togVie(id){snap();const p=P(id);p.alive=!p.alive;log(`(Correction) ${p.nom} ${p.alive?'remis en vie':'marqué mort'}.`);save();render();if(S.phase==='game')sheet('joueurs');else closeSheet()}

let wl=null;async function garderEcran(){try{if('wakeLock' in navigator&&S.phase==='game')wl=await navigator.wakeLock.request('screen')}catch(e){}}
document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible')garderEcran()});
if('serviceWorker' in navigator&&location.protocol==='https:')navigator.serviceWorker.register('sw.js').catch(()=>{});
render();garderEcran();
</script>
</body>
</html>
