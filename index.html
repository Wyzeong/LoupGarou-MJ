<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#04070a">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<title>Meneur de Loup-Garou</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IM+Fell+English+SC&family=IM+Fell+English:ital@0;1&display=swap" rel="stylesheet">
<style>
/* VOICE  sombre, conte de veillée
   IDEA   lisière de forêt la nuit, vue depuis le village
   PICTURE sapins en couches, lune voilée, brume, yeux rouges qui s'allument au loin
   COLOUR noir bleuté, rouge sang en accent ; le jour, braise ambrée
   TYPE   IM Fell English (titres, textes à dire) + system-ui */
:root{--bg:#04070a;--card:rgba(12,17,23,.86);--card2:rgba(28,35,46,.92);--txt:#e7e2d6;--mut:#98a1ab;--acc:#b3262f;--acctxt:#fff4ee;--red:#ff6070;--green:#5fc28a;--fell:"IM Fell English",Georgia,serif;--fellsc:"IM Fell English SC",Georgia,serif}
body.jour{--bg:#0d0907;--card:rgba(30,21,14,.88);--card2:rgba(56,40,26,.92);--mut:#b6a38b;--acc:#c98a33;--acctxt:#1a1006}
*{box-sizing:border-box}
html,body{margin:0}
body{font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--txt);transition:background .6s;-webkit-tap-highlight-color:transparent;min-height:100vh}
#decor{position:fixed;inset:0;z-index:0;pointer-events:none;transition:opacity .8s}
#decor svg{position:absolute;inset:0;width:100%;height:100%}
body:not(.accueil) #decor{opacity:.5}
.aube{position:absolute;inset:0;background:linear-gradient(to bottom,#3a1d10 0%,#5a2c12 35%,transparent 70%);opacity:0;transition:opacity .8s;mix-blend-mode:screen}
body.jour .aube{opacity:.35}
body.jour .yeux{opacity:0}
.yeux{transition:opacity 1s}
.oeil{animation:luire 9s infinite both;transform-box:fill-box;transform-origin:center;opacity:0}
@keyframes luire{0%,4%{opacity:0;transform:scaleY(1)}10%,40%{opacity:1;transform:scaleY(1)}42%{opacity:1;transform:scaleY(.1)}44%,72%{opacity:1;transform:scaleY(1)}80%,100%{opacity:0;transform:scaleY(1)}}
.etoile{animation:scint 4s infinite alternate}
@keyframes scint{from{opacity:.15}to{opacity:.8}}
.brume{position:absolute;left:-30%;width:160%;height:28%;bottom:8%;background:radial-gradient(ellipse at center,rgba(170,185,200,.13),transparent 65%);animation:brume 40s linear infinite alternate}
.brume.b2{bottom:0;height:22%;animation-duration:55s;animation-direction:alternate-reverse;opacity:.8}
@keyframes brume{from{transform:translateX(-8%)}to{transform:translateX(8%)}}
@media (prefers-reduced-motion:reduce){.oeil{animation:none;opacity:.9}.etoile,.brume{animation:none}}
header,main{position:relative;z-index:1}
header{position:sticky;top:0;z-index:5;display:flex;align-items:center;gap:6px;padding:10px 12px;padding-top:calc(10px + env(safe-area-inset-top));background:rgba(4,7,10,.82);-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);border-bottom:1px solid #ffffff10}
body.jour header{background:rgba(13,9,7,.85)}
body.accueil header{display:none}
header h1{font-family:var(--fellsc);font-weight:400;font-size:1.25rem;margin:0;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;letter-spacing:.02em}
.ib{background:var(--card2);border:0;color:var(--txt);border-radius:10px;padding:8px 11px;font-size:1rem;cursor:pointer;flex-shrink:0;min-height:40px}
main{padding:14px;max-width:640px;margin:0 auto;padding-bottom:120px}
.card{background:var(--card);border:1px solid #ffffff0d;border-radius:14px;padding:14px;margin-bottom:12px}
h2{font-family:var(--fell);font-weight:400;margin:.1rem 0 .8rem;font-size:1.9rem;line-height:1.1}
h3{margin:0 0 .6rem;font-size:.82rem;color:var(--mut);text-transform:uppercase;letter-spacing:.05em}
.phase{color:var(--acc);font-weight:700;font-size:.8rem;text-transform:uppercase;letter-spacing:.1em;filter:brightness(1.4)}
.read{border-left:3px solid var(--acc);background:linear-gradient(to right,rgba(0,0,0,.55),rgba(0,0,0,.35));padding:24px 16px 14px;border-radius:10px;font-family:var(--fell);font-size:1.28rem;line-height:1.5;font-style:italic;margin:0 0 12px;position:relative;box-shadow:inset 0 0 30px rgba(0,0,0,.4)}
.read .lbl{position:absolute;top:7px;left:16px;font-family:system-ui,sans-serif;font-size:.66rem;font-style:normal;text-transform:uppercase;letter-spacing:.1em;color:var(--acc);font-weight:700;filter:brightness(1.5)}
.tip{color:var(--mut);font-size:.93rem;line-height:1.45;margin:.3rem 0}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chips.center{justify-content:center}
.chip{background:var(--card2);border:1px solid #ffffff14;color:var(--txt);border-radius:999px;padding:10px 15px;font-size:1rem;cursor:pointer;margin:0;min-height:44px}
.card>.chip{margin-top:8px}
.chip.sel{background:var(--acc);border-color:var(--acc);color:var(--acctxt);font-weight:700;box-shadow:0 0 14px color-mix(in srgb,var(--acc) 55%,transparent)}
.reveal{background:rgba(0,0,0,.35);border:1px dashed var(--acc);border-radius:10px;padding:12px;margin-top:12px;font-size:1.05rem}
.row{display:flex;align-items:center;gap:8px;padding:9px 0;border-bottom:1px solid #ffffff10}
.row:last-child{border-bottom:0}
.row.mort{opacity:.45}
.grow{flex:1;min-width:0}
.num{width:1.6em;color:var(--mut);text-align:right}
.cnt{min-width:1.6em;text-align:center;font-size:1.1rem}
.q{color:var(--acc);font-size:.85rem;filter:brightness(1.5)}
.tag{font-size:.75rem;color:var(--acc);white-space:nowrap;filter:brightness(1.5)}
select,input{background:var(--card2);color:var(--txt);border:1px solid #ffffff22;border-radius:10px;padding:10px;font-size:1rem;width:100%;margin:4px 0}
.add{display:flex;gap:8px;margin-top:10px}.add input{margin:0}
.chk{display:flex;gap:10px;align-items:flex-start;margin-top:12px;line-height:1.35}
.chk input{width:22px;height:22px;flex-shrink:0;margin:0;accent-color:var(--acc)}
.ok{color:var(--green);font-weight:700}.err{color:var(--red);font-weight:700}
.footer{position:fixed;bottom:0;left:0;right:0;z-index:4;padding:14px;padding-bottom:calc(14px + env(safe-area-inset-bottom));background:linear-gradient(transparent,var(--bg) 40%)}
.btn{display:block;width:100%;max-width:612px;margin:0 auto;border:0;border-radius:14px;padding:17px;font-size:1.12rem;font-weight:700;background:var(--acc);color:var(--acctxt);cursor:pointer;box-shadow:0 6px 24px rgba(0,0,0,.5)}
.btn:disabled{opacity:.35}
.btn.sec{background:rgba(255,255,255,.08);color:var(--txt);border:1px solid #ffffff22;box-shadow:none}
.big{font-size:3.2rem;font-weight:800;text-align:center;font-variant-numeric:tabular-nums;margin:6px 0 12px}
.win{text-align:center;font-family:var(--fell);font-size:1.9rem;padding:24px 14px}
.sheet{position:fixed;inset:0;background:#000b;z-index:10;display:flex;align-items:flex-end;justify-content:center}
.sheet.hidden{display:none}
.panel{background:#090d12;width:100%;max-width:640px;max-height:88vh;overflow:auto;border-radius:18px 18px 0 0;padding:18px;padding-bottom:calc(24px + env(safe-area-inset-bottom));position:relative;border-top:1px solid #ffffff18}
body.jour .panel{background:#140e0a}
.panel .close{position:absolute;top:14px;right:14px}
details{background:var(--card);border-radius:10px;padding:10px 12px;margin:6px 0}
summary{cursor:pointer;font-weight:600}
#toast{position:fixed;left:50%;bottom:100px;transform:translateX(-50%);background:#000e;color:#fff;padding:12px 18px;border-radius:12px;z-index:20;max-width:90vw;text-align:center;opacity:0;transition:opacity .25s;pointer-events:none;border:1px solid #ffffff20}
#toast.on{opacity:1}
/* accueil */
.splash{min-height:calc(100vh - 28px);min-height:calc(100dvh - 28px);display:flex;flex-direction:column;justify-content:space-between;text-align:center;padding:calc(8vh + env(safe-area-inset-top)) 8px 0}
.sp-kicker{font-family:var(--fell);font-style:italic;color:var(--mut);font-size:1.2rem;letter-spacing:.06em;animation:apparait 2.5s ease-out both}
.sp-titre{font-family:var(--fellsc);font-weight:400;font-size:clamp(2.6rem,13vw,4.4rem);line-height:1;margin:.2em 0 .15em;color:#efe8d8;text-shadow:0 0 30px rgba(179,38,47,.45),0 2px 0 #000;animation:apparait 2.5s .3s ease-out both}
.sp-sous{color:var(--mut);margin:0;letter-spacing:.18em;text-transform:uppercase;font-size:.78rem;animation:apparait 2.5s .8s ease-out both}
.sp-cit{font-family:var(--fell);font-style:italic;font-size:1.25rem;color:#cfc6b4;margin:0 0 22px;animation:apparait 3s 1.4s ease-out both}
.sp-btns{display:grid;gap:10px;max-width:440px;margin:0 auto;animation:apparait 2s 1.8s ease-out both}
body.th-perso{--acc:#c2461b}body.th-nl{--bg:#03050a;--acc:#4f74b3;--acctxt:#f2f6ff}body.th-tout{--acc:#9b1d3a}
body.jour.th-perso,body.jour.th-nl,body.jour.th-tout{--acc:#c98a33;--acctxt:#1a1006}
.tuile{display:flex;align-items:center;gap:12px;width:100%;text-align:left;background:rgba(10,14,20,.72);border:1px solid #ffffff22;color:var(--txt);border-radius:14px;padding:12px 14px;cursor:pointer;-webkit-backdrop-filter:blur(4px);backdrop-filter:blur(4px);min-height:56px}
.tuile b{display:block;font-family:var(--fellsc);font-weight:400;font-size:1.25rem}.tuile small{color:var(--mut);font-size:.8rem}
.tuile .coche{width:26px;height:26px;border-radius:8px;border:2px solid #ffffff44;display:grid;place-items:center;font-weight:800;flex-shrink:0}
.tuile.on{border-color:var(--acc)}.tuile.on .coche{background:var(--acc);border-color:var(--acc);color:var(--acctxt)}
.tuile:disabled{opacity:.75;cursor:default}
@keyframes apparait{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
  .splash.deja *{animation:none!important}
body.accueil main{padding-bottom:calc(30px + env(safe-area-inset-bottom))}

/* ---------- tablette ---------- */
@media (min-width:700px){
 body{font-size:17px}
 main{max-width:860px;padding:22px 28px 130px}
 header{padding-left:28px;padding-right:28px}
 header h1{font-size:1.5rem}
 .ib{min-height:46px;padding:10px 14px;font-size:1.1rem}
 h2{font-size:2.4rem}
 .card{padding:18px 20px;border-radius:16px}
 .read{font-size:1.5rem;padding:28px 22px 18px}
 .chip{font-size:1.12rem;padding:13px 20px;min-height:52px}
 .chips{gap:10px}
 .tip{font-size:1rem}
 .footer .btn{max-width:600px;font-size:1.25rem;padding:20px}
 .grille2{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:14px;align-items:start}
 .grille2>.card{margin-bottom:0}
 .sheet{align-items:center;padding:24px}
 .panel{border-radius:20px;max-width:720px;max-height:84vh;border:1px solid #ffffff18}
 .sp-titre{font-size:clamp(4.4rem,10vw,6.5rem)}
 .sp-kicker{font-size:1.5rem}.sp-sous{font-size:.95rem}.sp-cit{font-size:1.6rem}
 .sp-btns{max-width:520px}
 .tuile{padding:16px 18px}.tuile b{font-size:1.45rem}
 .big{font-size:4.5rem}
}
@media (min-aspect-ratio:1/1){.lune{transform:translate(230px,-150px)}}
/* tablette à l'horizontale : textes à dire à gauche, actions à droite */
@media (min-width:1000px) and (orientation:landscape){
 main{max-width:1240px}
 .etape{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1fr);column-gap:22px;grid-auto-flow:row dense;align-items:start}
 .etape>*{grid-column:2}
 .etape>.read{grid-column:1}
 .etape>.entete{grid-column:1/-1}
 .footer .btn{max-width:700px}
}
</style>
</head>
<body>
<div id="decor" aria-hidden="true"><svg id="foret" viewBox="0 0 1200 900" preserveAspectRatio="xMidYMax slice"></svg><div class="brume"></div><div class="brume b2"></div><div class="aube"></div></div>
<header id="top"></header>
<main id="app"></main>
<div id="sheet" class="sheet hidden"></div>
<div id="toast"></div>
<script>
'use strict';
const ROLES={
 loup:{nom:'Loup-Garou',ico:'🐺',max:4,desc:"Chaque nuit, les Loups-Garous se réveillent ensemble et choisissent une victime. Le jour, ils se font passer pour d'innocents villageois."},
 villageois:{nom:'Simple Villageois',ico:'🧑‍🌾',max:13,desc:"Aucun pouvoir. Ses armes : son intuition, sa parole et son vote."},
 voyante:{nom:'Voyante',ico:'🔮',max:1,desc:"Chaque nuit, elle découvre la vraie carte d'un joueur de son choix."},
 sorciere:{nom:'Sorcière',ico:'🧪',max:1,desc:"Elle a deux potions, chacune utilisable une seule fois dans la partie : une potion de vie pour sauver la victime des Loups (elle peut se sauver elle-même) et une potion de mort pour éliminer un joueur. Elle peut utiliser les deux la même nuit."},
 chasseur:{nom:'Chasseur',ico:'🏹',max:1,desc:"Quand il meurt, quelle qu'en soit la cause, il élimine immédiatement un autre joueur de son choix."},
 cupidon:{nom:'Cupidon',ico:'💘',max:1,desc:"La première nuit, il désigne deux amoureux (il peut se choisir lui-même). Si l'un meurt, l'autre meurt aussitôt de chagrin. Si le couple est formé d'un Loup et d'un villageois, son seul but devient d'être les deux derniers survivants."},
 petitefille:{nom:'Petite Fille',ico:'👧',max:1,desc:"Pendant le tour des Loups-Garous, elle peut entrouvrir les yeux pour les espionner. Si un Loup la surprend, elle meurt à la place de la victime désignée."},
 voleur:{nom:'Voleur',ico:'🃏',max:1,desc:"On distribue 2 cartes de plus que de joueurs (en général 2 Simples Villageois en plus) : les 2 cartes restantes sont posées face cachée au centre. La première nuit, le Voleur peut échanger sa carte contre l'une d'elles. S'il y a 2 Loups-Garous au centre, il est obligé d'en prendre un."},
 montreur:{nom:"Montreur d'Ours",ico:'🐻',max:1,et:1,desc:"Chaque matin, son ours grogne si l'un de ses deux voisins vivants est un Loup-Garou.",
  long:"Le Montreur d'Ours se promène partout avec son ours, une bête au flair redoutable. Chaque matin, juste après l'annonce des morts, si l'un de ses deux voisins directs (les joueurs vivants assis juste à sa gauche et à sa droite) est un Loup-Garou, l'ours grogne : le meneur pousse alors un « Grrrr ! ». Si l'ours reste silencieux, ses deux voisins sont innocents… pour l'instant. Il joue avec le village."},
 renard:{nom:'Renard',ico:'🦊',max:1,et:1,desc:"Chaque nuit, il désigne un joueur : il apprend si ce joueur ou l'un de ses deux voisins est un Loup. S'il se trompe, il perd son flair.",
  long:"Chaque nuit, le Renard se réveille et désigne un joueur. Le meneur lui indique d'un signe de tête si, parmi ce joueur et ses deux voisins vivants, se cache au moins un Loup-Garou. Si oui, il garde son flair. Si non, il perd son pouvoir pour le reste de la partie : il doit donc bien choisir. Il joue avec le village."},
 soeur:{nom:'Deux Sœurs',ico:'👭',max:2,et:1,desc:"Les deux Sœurs se reconnaissent la première nuit et peuvent se faire confiance.",
  long:"Les Deux Sœurs se réveillent ensemble la première nuit et se reconnaissent. Elles savent donc qu'elles peuvent se faire une confiance totale. Pendant les débats, elles peuvent s'entraider… mais si elles se défendent trop l'une l'autre, les loups risquent de les repérer ! Elles jouent avec le village."},
 chevalier:{nom:"Chevalier à l'Épée Rouillée",ico:'⚔️',max:1,et:1,desc:"S'il est dévoré, le premier Loup à sa gauche attrape le tétanos et meurt la nuit suivante.",
  long:"Le Chevalier à l'Épée Rouillée n'a aucun pouvoir tant qu'il est vivant. Mais si les Loups-Garous le dévorent, ils se blessent sur sa vieille épée rouillée : le premier Loup-Garou assis à sa gauche attrape le tétanos et meurt à son tour, au matin de la nuit suivante. Un repas qui coûte cher ! Il joue avec le village."},
 enfant:{nom:'Enfant Sauvage',ico:'🌿',max:1,et:2,desc:"Il choisit un modèle la première nuit. Si ce modèle meurt, l'Enfant devient Loup-Garou.",
  long:"La première nuit, l'Enfant Sauvage choisit en secret un modèle parmi les joueurs. Tant que ce modèle est en vie, l'Enfant est un simple villageois. Mais si le modèle meurt, peu importe comment, l'Enfant retourne à l'état sauvage : il devient un Loup-Garou, se réveille avec la meute chaque nuit et gagne désormais avec les loups."},
 chienloup:{nom:'Chien-Loup',ico:'🐕',max:1,et:2,desc:"La première nuit, il choisit d'être villageois ou Loup-Garou pour toute la partie.",
  long:"La première nuit, le Chien-Loup choisit son camp pour toute la partie : rester un fidèle chien du village (il joue alors comme un simple villageois) ou devenir un Loup-Garou (il se réveille alors avec la meute dès cette nuit-là). Personne d'autre ne connaît son choix… et sa carte ne dit pas lequel il a fait !"},
 villvill:{nom:'Villageois-Villageois',ico:'🌾',max:1,et:2,desc:"Sa carte a deux faces Villageois : tout le monde sait qu'il est innocent.",
  long:"Sa carte a deux faces Villageois : tout le monde peut voir qu'il est innocent. Il n'a aucun pouvoir, mais c'est le seul joueur en qui le village peut avoir une confiance absolue. À lui de bien s'en servir pour guider les débats… et de survivre, car les loups adorent ce genre de proie."},
 ipdl:{nom:'Infect Père des Loups',ico:'🩸',max:1,et:2,desc:"Une fois dans la partie, il peut infecter la victime des Loups : elle ne meurt pas et devient Loup-Garou.",
  long:"L'Infect Père des Loups se réveille avec les autres Loups-Garous et dévore avec eux. Mais une fois dans la partie, il peut décider d'infecter la victime au lieu de la tuer : elle ne meurt pas, et devient secrètement un Loup-Garou. Elle se réveillera avec la meute dès la nuit suivante, tout en gardant son éventuel pouvoir (une Voyante infectée continue de voir… mais pour les loups !). Il joue avec les loups."},
 gml:{nom:'Grand Méchant Loup',ico:'👹',max:1,et:3,desc:"Tant qu'aucun Loup n'est mort, il dévore une seconde victime chaque nuit.",
  long:"Le Grand Méchant Loup se réveille avec la meute et dévore avec elle. Puis, tant qu'aucun Loup-Garou n'a été éliminé, il se réveille une seconde fois, seul, et dévore une deuxième victime. Dès qu'un membre de la meute meurt, il perd ce pouvoir et redevient un loup comme les autres. Il joue avec les loups."},
 servante:{nom:'Servante Dévouée',ico:'🧹',max:1,et:3,desc:"Une fois, elle peut prendre secrètement le rôle d'un joueur éliminé par le vote.",
  long:"Quand un joueur est éliminé par le vote du village, et avant qu'il ne retourne sa carte, la Servante Dévouée peut se révéler (une seule fois dans la partie). Elle montre alors sa carte et prend celle du joueur éliminé, sans la montrer à personne : elle hérite de son rôle et de son camp pour la suite de la partie. Le joueur éliminé meurt quand même, mais personne ne saura qui il était…"},
 juge:{nom:'Juge Bègue',ico:'⚖️',max:1,et:3,desc:"Une fois dans la partie, par un signe convenu, il déclenche un second vote le même jour.",
  long:"La première nuit, le Juge Bègue montre au meneur un petit signe discret (se gratter l'oreille, croiser les bras…). Une seule fois dans la partie, pendant un vote, il peut faire ce signe : aussitôt après ce vote, le village doit voter une deuxième fois, sans débat. Deux éliminations dans la même journée ! Il joue avec le village."},
 ange:{nom:'Ange',ico:'😇',max:1,et:3,desc:"La partie commence par un vote. S'il est le premier éliminé, il gagne seul.",
  long:"Quand l'Ange est en jeu, la partie commence par un débat et un vote, avant même la première nuit. L'Ange n'a qu'un but : mourir le premier. S'il est le premier joueur éliminé (par ce premier vote, ou dévoré lors de la première nuit), il gagne la partie à lui seul et tout s'arrête ! S'il survit à ce premier tour, il devient un simple villageois."}
,
 salvateur:{nom:'Salvateur',ico:'🛡️',max:1,nl:1,desc:"Chaque nuit, il protège un joueur contre les Loups (pas deux fois de suite le même).",
  long:"Chaque nuit, le Salvateur se réveille juste avant les Loups-Garous et désigne un joueur qu'il protège. Si les Loups attaquent ce joueur cette nuit-là, il survit. Le Salvateur peut se protéger lui-même, mais il ne peut jamais protéger la même personne deux nuits de suite. Il joue avec le village."},
 ancien:{nom:'Ancien',ico:'👴',max:1,nl:1,desc:"Il survit à la première attaque des Loups. Si le village le tue, les villageois perdent leurs pouvoirs.",
  long:"L'Ancien a la peau dure : il survit à la première attaque des Loups-Garous, et ne meurt qu'à la deuxième. Mais attention : si c'est le village qui le tue (par le vote, le tir du Chasseur ou la potion de la Sorcière), les villageois sont si honteux qu'ils perdent tous leurs pouvoirs spéciaux jusqu'à la fin de la partie. Il joue avec le village."},
 idiot:{nom:'Idiot du Village',ico:'🤪',max:1,nl:1,desc:"Voté par le village, il est gracié mais perd son droit de vote.",
  long:"Si le village vote contre l'Idiot du Village, il retourne sa carte… et le village, réalisant qu'il a voulu exécuter un simple d'esprit, le gracie. Il reste en vie, mais il perd son droit de vote pour le reste de la partie. Si les Loups le dévorent, il meurt normalement. Il joue avec le village."},
 bouc:{nom:'Bouc Émissaire',ico:'🐐',max:1,nl:1,desc:"En cas d'égalité au vote, c'est lui qui meurt. Il choisit qui votera le lendemain.",

function fresh(){let noms=[];try{noms=JSON.parse(localStorage.getItem(NKEY))||[]}catch(e){}
 return {phase:'setup',ext:{perso:false,nl:false},etape:1,noms,comp:null,compPerso:false,capitaine:true,players:[],cycle:'nuit',num:1,steps:[],idx:0,out:[],cap:null,witch:{vie:true,mort:true},nuit:{victime:null,victime2:null,sauve:null,poison:null,infecte:null},queue:[],log:[],ready:false,winner:null,tmp:{}}}
function load(){try{return JSON.parse(localStorage.getItem(KEY))}catch(e){return null}}
let S=load()||fresh();if(!S.ext)S.ext={perso:S.mode==='personnages',nl:false};
function save(){try{localStorage.setItem(KEY,JSON.stringify(S));localStorage.setItem(NKEY,JSON.stringify(S.noms))}catch(e){}}
function snap(){HIST.push(JSON.stringify(S));if(HIST.length>60)HIST.shift()}
function undo(){if(!HIST.length){toast('Rien à annuler');return}S=JSON.parse(HIST.pop());save();closeSheet();render();toast('Dernière action annulée')}

const $=s=>document.querySelector(s);
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const P=id=>S.players.find(p=>p.id===id);
const nm=id=>{const p=P(id);return p?esc(p.nom):'?'};
const vivants=()=>S.players.filter(p=>p.alive);
const enJeu=r=>(S.comp[r]||0)-S.out.filter(x=>x===r).length;
const porteurs=r=>S.players.filter(p=>p.role===r);
const pris=()=>S.players.filter(p=>p.role).map(p=>p.id);
const rn=r=>r?ROLES[r].ico+' '+ROLES[r].nom:'❓ Inconnu';
const n1=()=>S.num===1&&!S.ready;
const resteN1=r=>enJeu(r)-porteurs(r).filter(p=>!p.alive).length;
function actif(r){if(S.pouvoirsPerdus&&!LOUPS.includes(r)&&r!=='flute')return false;if(n1())return resteN1(r)>0;return S.players.some(p=>p.alive&&p.role===r)}
const LOUPS=['loup','ipdl','gml'];
function isLoup(p){return LOUPS.includes(p.role)||!!p.infecte||!!p.sauvage||(p.role==='chienloup'&&p.chien==='loup')}
function loupsVivants(){return vivants().filter(isLoup)}
function voisins(id){const al=vivants();const i=al.findIndex(p=>p.id===id);if(i<0||al.length<2)return [];const a=al[(i-1+al.length)%al.length],b=al[(i+1)%al.length];return a.id===b.id?[a]:[a,b]}
function aGauche(id){const L=S.players,i=L.findIndex(p=>p.id===id);for(let k=1;k<L.length;k++){const q=L[(i+k)%L.length];if(q.alive&&isLoup(q))return q}return null}
const extP=()=>!!(S.ext&&S.ext.perso),extN=()=>!!(S.ext&&S.ext.nl);
const dispo=r=>{const o=ROLES[r];if(o.et)return extP()&&o.et<=S.etape;if(o.nl)return extN();return true};
const theme=()=>extP()&&extN()?'tout':extP()?'perso':extN()?'nl':'classique';
const THEMES={classique:{nom:'Classique',cit:"« Quelque chose rôde à l'orée du bois… »"},perso:{nom:'Personnages',cit:"« De nouveaux visages sont arrivés au village… »"},nl:{nom:'Nouvelle Lune',cit:"« Cette nuit, la lune a disparu du ciel… »"},tout:{nom:'Personnages + Nouvelle Lune',cit:"« La lune saigne, et tout Thiercelieux retient son souffle… »"}};
const lib=()=>S.cycle==='nuit'?'🌙 Nuit '+S.num:(S.num===0?'☀️ Veille':'☀️ Jour '+S.num);
function log(t){S.log.push({c:S.phase==='game'||S.phase==='fin'?lib():'',t})}
function toast(m){const t=$('#toast');t.textContent=m;t.classList.add('on');clearTimeout(t._t);t._t=setTimeout(()=>t.classList.remove('on'),2600)}

/* ---------- composants ---------- */
function dire(t){return `<div class="read"><span class="lbl">À dire</span><span class="t">${t}</span></div>`}
function picker(f,o={}){const multi=!!o.multi,max=o.max||1,ex=o.exclude||[];
 const list=(o.list||vivants()).filter(p=>!ex.includes(p.id));const cur=S.tmp[f];
 if(!list.length)return '<p class="tip">Aucun joueur disponible.</p>';
 return '<div class="chips">'+list.map(p=>{const sel=multi?(cur||[]).includes(p.id):cur===p.id;
  return `<button class="chip${sel?' sel':''}" onclick="pk('${f}',${p.id},${multi},${max})">${esc(p.nom)}</button>`}).join('')+'</div>'}
function pk(f,id,multi,max){if(multi){let a=(S.tmp[f]||[]).slice();if(a.includes(id))a=a.filter(x=>x!==id);else{a.push(id);if(a.length>max)a.shift()}S.tmp[f]=a}
 else S.tmp[f]=S.tmp[f]===id?null:id;save();render()}
function setT(k,v){S.tmp[k]=v;save();render()}

/* ---------- déroulé ---------- */
const NUIT=['n_ambiance','n_intro','n_voleur','n_reperage','n_cupidon','n_amoureux','n_soeurs','n_juge','n_enfant','n_chien','n_voyante','n_salvateur','n_loups','n_infect','n_gml','n_renard','n_sorciere','n_flute','n_charmes','n_fin'];
const JOUR=['n_ambiance','d_ange','d_reveil','d_ours','d_election','d_debat','d_vote','d_vote2','d_fin'];
const ST={};
const REPERE={ancien:"Ancien, lève discrètement le pouce, sans ouvrir les yeux… Tu as traversé tant d'hivers que ta peau est dure comme le cuir : la première morsure des Loups ne suffira pas à te tuer. Mais si un jour le village lui-même te condamne… il perdra toute sa sagesse. Tu peux baisser le pouce.",bouc:"Bouc Émissaire, lève discrètement le pouce, sans ouvrir les yeux… Au village, quand on ne sait pas qui accuser, c'est toujours sur toi que ça retombe. En cas d'égalité au vote, c'est toi qui seras exécuté… mais tu auras le dernier mot. Tu peux baisser le pouce.",montreur:"Montreur d'Ours, lève discrètement le pouce, sans ouvrir les yeux… Ton ours fidèle ne te quitte jamais. Chaque matin, s'il sent qu'un Loup-Garou est assis juste à côté de toi, il grognera. Tu peux baisser le pouce.",chevalier:"Chevalier à l'Épée Rouillée, lève discrètement le pouce, sans ouvrir les yeux… Ta vieille épée est couverte de rouille. Si les Loups osent te dévorer, le premier d'entre eux assis à ta gauche s'y blessera… et n'y survivra pas. Tu peux baisser le pouce.",chasseur:"Chasseur, lève discrètement le pouce, sans ouvrir les yeux… Sache que ton fusil ne te quitte jamais, même dans ton sommeil : si tu viens à mourir, quelle qu'en soit la raison, tu auras encore la force de tirer une dernière balle et d'emporter quelqu'un avec toi dans la tombe. Tu peux baisser le pouce.",petitefille:"Petite Fille, lève discrètement le pouce, sans ouvrir les yeux… Toi, la curieuse du village, quand les Loups-Garous se réveilleront, tu pourras entrouvrir les yeux pour les espionner. Mais prends garde : s'ils te surprennent, c'est toi qu'ils dévoreront à la place de leur victime. Tu peux baisser le pouce."};
const aReperer=()=>['chasseur','petitefille','montreur','chevalier','ancien','bouc'].filter(r=>resteN1(r)>0&&!porteurs(r).length);
const ancienResiste=id=>{const q=P(id);return q&&q.role==='ancien'&&!S.ancienBlesse};
const attaque=id=>id!=null&&id!==S.nuit.sauve&&id!==S.nuit.protege;
function mortsNuit(){const m=[],n=S.nuit,add=id=>{if(id!=null&&!m.includes(id)&&P(id)&&P(id).alive)m.push(id)};
 [n.victime,n.victime2].forEach(v=>{if(attaque(v)&&!ancienResiste(v))add(v)});add(n.poison);
 if(S.rouille&&S.rouille.nuit===S.num)add(S.rouille.id);return m}
function causeNuit(id){const n=S.nuit;if(S.rouille&&S.rouille.nuit===S.num&&S.rouille.id===id&&id!==n.victime&&id!==n.victime2&&id!==n.poison)return 'rouille';return id===n.poison&&id!==n.victime&&id!==n.victime2?'poison':'loups'}

 html:()=>`<div class="card tip">🕯️ Baisse la lumière si tu peux. Parle lentement, à voix basse, et marque bien les pauses (…).</div>`+
 dire("Bienvenue à Thiercelieux, un petit village perdu au creux de la forêt, loin de tout.<br><br>Depuis plusieurs nuits, d'étranges bruits troublent le sommeil des villageois : des grattements contre les volets… des pas lourds dans la boue… et, au loin, des hurlements qui glacent le sang.<br><br>Le vieux berger a été retrouvé un matin, à l'orée du bois… ou du moins, ce qu'il en restait. Puis ce fut le tour de la fille du meunier. Les traces autour de son corps ne ressemblaient à celles d'aucune bête connue.<br><br>Les anciens murmurent une vieille légende : certains d'entre nous, la nuit venue, ne seraient plus tout à fait humains.<br><br>Ce soir, la lune est pleine. Regardez bien vos voisins… car parmi vous, assis à cette table, se cachent des Loups-Garous.<br><br>Le jour, ils vous sourient. La nuit, ils chassent.<br><br>Votre seule chance de survie : les démasquer… avant qu'il ne soit trop tard."),next:()=>{S.ambDone=true}};

ST.n_voleur={cond:()=>n1()&&(S.comp.voleur||0)>0,titre:()=>'Le Voleur',btn:'Valider',
 html:()=>{const t=S.tmp;const opts=k=>ORDER.filter(x=>S.comp[x]>0).map(x=>`<option value="${x}" ${t[k]===x?'selected':''}>${rn(x)}</option>`).join('');
  let h=dire("Voleur, réveille-toi. Toi qui vis de larcins et de mauvais coups, cette nuit le hasard t'offre une chance unique : au centre de la table reposent deux cartes oubliées. Tu peux échanger ta propre identité contre l'une d'elles… ou garder la tienne. Mais prends garde : si deux Loups-Garous t'attendent au centre, la malédiction est trop forte et tu devras en prendre un. Ton choix est définitif : tu deviendras ce que tu as volé.");
  h+=`<div class="card"><h3>1. Cartes du centre</h3><p class="tip">Regarde discrètement les 2 cartes du centre :</p><select onchange="setT('c1',this.value)"><option value="">Carte 1…</option>${opts('c1')}</select><select onchange="setT('c2',this.value)"><option value="">Carte 2…</option>${opts('c2')}</select></div>`;
  h+=`<div class="card"><h3>2. Qui est le Voleur ?</h3>${picker('vol')}<button class="chip ${t.vol===-1?'sel':''}" onclick="pk('vol',-1,false,1)">Personne (le Voleur est au centre)</button></div>`;
  if(t.vol!=null&&t.vol!==-1&&t.c1&&t.c2){h+=`<div class="card"><h3>3. Son choix</h3><div class="chips">`+[['garder','Garde sa carte'],['c1','Prend '+rn(t.c1)],['c2','Prend '+rn(t.c2)]].map(([v,l])=>`<button class="chip ${t.ch===v?'sel':''}" onclick="setT('ch','${v}')">${l}</button>`).join('')+'</div>'+(t.c1==='loup'&&t.c2==='loup'?'<p class="tip">⚠️ Deux Loups au centre : il est obligé d\'en prendre un.</p>':'')+'<p class="tip">S\'il échange, il prend la carte choisie et pose la sienne au centre.</p></div>'}
  return h+dire("Voleur, rendors-toi… avec ta nouvelle vie entre les mains.")},
 next:()=>{const t=S.tmp;if(!t.c1||!t.c2)return 'Indique les 2 cartes du centre.';if(t.vol==null)return 'Indique qui est le Voleur.';
  const c=[t.c1,t.c2];for(const r of ORDER)if(c.filter(x=>x===r).length>(S.comp[r]||0))return 'Ces 2 cartes ne correspondent pas à la composition.';
  if(t.vol===-1){if(!c.includes('voleur'))return "Si personne n'est Voleur, l'une des cartes du centre doit être le Voleur.";S.out=c;log('Le Voleur était au centre. Hors jeu : '+c.map(x=>ROLES[x].nom).join(', ')+'.');return}
  if(c.includes('voleur'))return "Le Voleur est un joueur : il ne peut pas aussi être au centre.";
  if(!t.ch)return 'Indique le choix du Voleur.';
  if(t.ch==='garder'&&t.c1==='loup'&&t.c2==='loup')return 'Avec 2 Loups au centre, il doit en prendre un.';
  const p=P(t.vol);
  if(t.ch==='garder'){p.role='voleur';S.out=c;log(p.nom+' (Voleur) garde sa carte.')}
  else{const pr=t[t.ch],au=t.ch==='c1'?t.c2:t.c1;p.role=pr;S.out=['voleur',au];log(`${p.nom} (Voleur) prend la carte ${ROLES[pr].nom}.`)}}};

 next:()=>{const c=porteurs('chienloup').find(p=>p.alive);if(!c&&S.tmp.cl==null)return 'Indique qui est le Chien-Loup.';if(!S.tmp.ch)return 'Indique son choix.';
  const q=c||P(S.tmp.cl);q.role='chienloup';q.chien=S.tmp.ch;log(`Le Chien-Loup (${q.nom}) a choisi ${S.tmp.ch==='loup'?'la meute':'le village'}.`)}};

ST.n_voyante={cond:()=>actif('voyante'),titre:()=>'La Voyante',btn:'Valider',
 html:()=>{const v=porteurs('voyante')[0],vid=v?v.id:S.tmp.voy;let h=dire(n1()?"Voyante, réveille-toi. Toi qui lis dans les âmes comme d'autres lisent dans les livres… Chaque nuit, ta boule de cristal te révélera la véritable nature d'un habitant du village. Désigne le joueur dont tu veux percer le secret.":"Voyante, réveille-toi. Ta boule de cristal s'éclaire à nouveau dans l'obscurité… Quel secret veux-tu percer cette nuit ?");
  h+=v?`<p class="tip">Voyante : <b>${esc(v.nom)}</b></p>`:`<div class="card"><h3>Qui est la Voyante ?</h3>${picker('voy',{exclude:pris()})}</div>`;
  h+=`<div class="card"><h3>Joueur désigné</h3>${picker('cible',{exclude:vid!=null?[vid]:[]})}`;

  return h+'</div>'+dire("Garde précieusement ce que tu as vu, Voyante… et rendors-toi.")},
 next:()=>{const v=porteurs('voyante')[0];if(!v&&S.tmp.voy==null)return 'Indique qui est la Voyante.';if(S.tmp.cible==null)return 'Indique le joueur désigné par la Voyante.';
  if(!v)P(S.tmp.voy).role='voyante';const c=P(S.tmp.cible);log(`La Voyante a regardé la carte de ${c.nom}${c.role?' ('+ROLES[c.role].nom+')':''}.`)}};

ST.n_renard={cond:()=>actif('renard')&&S.renardOK!==false,titre:()=>'Le Renard',btn:'Valider',
 html:()=>{const r=porteurs('renard').find(p=>p.alive),rid=r?r.id:S.tmp.re;let h=dire(n1()?"Renard, réveille-toi. Ton flair est ton plus grand talent. Chaque nuit, désigne un joueur : je te dirai si, parmi lui et ses deux voisins, se cache au moins un Loup-Garou. Mais si ton flair te trompe et qu'aucun loup ne s'y trouve… tu le perdras à jamais.":"Renard, réveille-toi. Où ton flair te mène-t-il cette nuit ?");
  h+=r?`<p class="tip">Renard : <b>${esc(r.nom)}</b></p>`:`<div class="card"><h3>Qui est le Renard ?</h3>${picker('re',{exclude:pris()})}</div>`;
  h+=`<div class="card"><h3>Joueur désigné</h3>${picker('rc')}`;
  if(S.tmp.rc!=null){const g=[P(S.tmp.rc),...voisins(S.tmp.rc)],oui=g.some(isLoup);
   h+=`<div class="reveal">Groupe flairé : <b>${g.map(x=>esc(x.nom)).join(', ')}</b><br>${oui?'👉 Hoche la tête : <b>OUI</b>, il y a au moins un loup.':'👉 Secoue la tête : <b>NON</b>. Il perd son flair pour toute la partie.'}</div>`}
  return h+'</div>'+dire("Renard, rendors-toi.")},
 next:()=>{const r=porteurs('renard').find(p=>p.alive);if(!r&&S.tmp.re==null)return 'Indique qui est le Renard.';if(S.tmp.rc==null)return 'Indique le joueur désigné.';
  if(!r)P(S.tmp.re).role='renard';const g=[P(S.tmp.rc),...voisins(S.tmp.rc)];if(!g.some(isLoup)){S.renardOK=false;log('Le Renard a perdu son flair.')}else log(`Le Renard a flairé autour de ${P(S.tmp.rc).nom}.`)}};

ST.n_salvateur={cond:()=>actif('salvateur'),titre:()=>'Le Salvateur',btn:'Valider',
 html:()=>{const v=porteurs('salvateur').find(p=>p.alive);let h=dire(n1()?"Salvateur, réveille-toi. Tu veilles sur le village, bouclier levé, quand tous les autres dorment. Chaque nuit, désigne un joueur que tu protégeras contre les Loups-Garous ; tu peux te choisir toi-même. Mais tu ne pourras jamais protéger la même personne deux nuits de suite.":"Salvateur, réveille-toi. Sur qui veilleras-tu cette nuit ?");
  h+=v?`<p class="tip">Salvateur : <b>${esc(v.nom)}</b></p>`:`<div class="card"><h3>Qui est le Salvateur ?</h3>${picker('sa',{exclude:pris()})}</div>`;
  h+=`<div class="card"><h3>Joueur protégé</h3>${picker('pr',{exclude:S.dernierProtege!=null?[S.dernierProtege]:[]})}${S.dernierProtege!=null&&P(S.dernierProtege).alive?`<p class="tip">Interdit cette nuit : ${nm(S.dernierProtege)} (protégé la nuit dernière).</p>`:''}</div>`;
  return h+dire("Salvateur, rendors-toi, ton bouclier à portée de main.")},
 next:()=>{const v=porteurs('salvateur').find(p=>p.alive);if(!v&&S.tmp.sa==null)return 'Indique qui est le Salvateur.';if(S.tmp.pr==null)return 'Indique le joueur protégé.';
  if(!v)P(S.tmp.sa).role='salvateur';S.nuit.protege=S.tmp.pr;S.dernierProtege=S.tmp.pr;log(`Le Salvateur protège ${P(S.tmp.pr).nom}.`)}};

ST.n_loups={cond:()=>loupsVivants().length>0||(n1()&&LOUPS.some(r=>resteN1(r)>0)),titre:()=>'Les Loups-Garous',btn:'Valider la victime',
 html:()=>{const nb=resteN1('loup');if(n1()&&S.tmp.lp==null)S.tmp.lp=porteurs('loup').filter(p=>p.alive).map(p=>p.id);
  const autres=pris().filter(id=>P(id).role!=='loup');
  const loups=n1()?[...(S.tmp.lp||[]),S.tmp.ip,S.tmp.gm,...loupsVivants().map(p=>p.id)].filter(x=>x!=null):loupsVivants().map(p=>p.id);
  let h=dire(n1()?"Loups-Garous, réveillez-vous. Ouvrez les yeux et reconnaissez vos frères de meute. Le jour, vous êtes des villageois comme les autres ; mais la nuit, une faim terrible vous dévore. Chaque nuit, vous choisirez ensemble, en silence, une victime. Le jour venu, mentez, accusez, semez le doute… et ne vous faites jamais démasquer. Désignez votre proie.":"Loups-Garous, réveillez-vous. La lune vous appelle et la faim vous tenaille… Qui sera votre proie cette nuit ?");
  if(n1()){if(nb>0)h+=`<div class="card"><h3>Qui sont les Loups-Garous ? (${nb})</h3>${picker('lp',{multi:true,max:nb,exclude:autres})}</div>`;
   if(resteN1('ipdl')>0&&!porteurs('ipdl').length)h+=`<div class="card"><h3>${rn('ipdl')}</h3>${picker('ip',{exclude:[...pris(),...(S.tmp.lp||[]),S.tmp.gm]})}</div>`;
   if(resteN1('gml')>0&&!porteurs('gml').length)h+=`<div class="card"><h3>${rn('gml')}</h3>${picker('gm',{exclude:[...pris(),...(S.tmp.lp||[]),S.tmp.ip]})}</div>`;
   const cl=S.players.find(p=>p.chien==='loup');if(cl)h+=`<p class="tip">🐕 Le Chien-Loup (${esc(cl.nom)}) se réveille aussi avec eux.</p>`}
  else{h+=`<p class="tip">Meute en vie : <b>${loupsVivants().map(p=>esc(p.nom)+(p.role!=='loup'?' ('+(p.infecte?'infecté':p.sauvage?'Enfant Sauvage':ROLES[p.role].nom)+')':'')).join(', ')}</b></p>`;
   const nouv=S.players.filter(p=>p.alive&&(p.infecte||p.sauvage)&&!p.annonce);if(nouv.length)h+=`<div class="reveal">👉 Cette nuit, <b>${nouv.map(p=>esc(p.nom)).join(', ')}</b> se réveille pour la première fois avec la meute. Touche-lui l'épaule pour qu'il ouvre les yeux.</div>`}
  h+=`<div class="card"><h3>Victime désignée</h3>${picker('vic',{exclude:loups})}`;
  const pf=S.players.find(p=>p.role==='petitefille'&&p.alive);
  if(pf)h+=`<label class="chk"><input type="checkbox" ${S.tmp.pfs?'checked':''} onchange="setT('pfs',this.checked)"> La Petite Fille (${esc(pf.nom)}) s'est fait surprendre par un Loup : elle meurt à la place de la victime</label>`;
  h+=`</div><p class="tip">${actif('petitefille')?'👀 Surveille la Petite Fille pendant ce tour. ':''}Attends que les Loups soient d'accord et désignent clairement leur victime du doigt.</p>`;
  return h+dire("Les Loups-Garous, repus, essuient leurs babines, regagnent leurs maisons… et se rendorment.")},
 next:()=>{if(n1()){const lp=S.tmp.lp||[],nb=resteN1('loup');if(lp.length!==nb)return `Sélectionne les ${nb} Loups-Garous.`;
   if(resteN1('ipdl')>0&&!porteurs('ipdl').length&&S.tmp.ip==null)return "Indique l'Infect Père des Loups.";
   if(resteN1('gml')>0&&!porteurs('gml').length&&S.tmp.gm==null)return 'Indique le Grand Méchant Loup.';
   lp.forEach(id=>P(id).role='loup');if(S.tmp.ip!=null)P(S.tmp.ip).role='ipdl';if(S.tmp.gm!=null)P(S.tmp.gm).role='gml'}
  S.players.forEach(p=>{if(p.infecte||p.sauvage)p.annonce=true});
  const pf=S.players.find(p=>p.role==='petitefille'&&p.alive);let v=S.tmp.vic;if(pf&&S.tmp.pfs)v=pf.id;
  if(v==null)return 'Indique la victime des Loups.';S.nuit.victime=v;log(`Les Loups ont désigné ${P(v).nom}${pf&&S.tmp.pfs?' (Petite Fille surprise)':''}.`)}};

ST.n_infect={cond:()=>actif('ipdl')&&!S.infectUsed&&S.nuit.victime!=null&&S.nuit.victime!==S.nuit.protege,titre:()=>"L'Infect Père des Loups",btn:'Valider',
 html:()=>dire(S.infectDit?"Infect Père des Loups, réveille-toi. Veux-tu transmettre ta malédiction à la victime ?":"Infect Père des Loups, réveille-toi. Toi, le tout premier loup de nos contrées, ta morsure ne tue pas toujours… elle peut aussi transmettre la malédiction. Une seule fois dans la partie, tu peux choisir d'infecter la victime : au lieu de mourir, elle deviendra l'une des vôtres, en gardant ses pouvoirs. Lève la main si tu veux l'infecter cette nuit.")+
  `<div class="card"><h3>Victime : ${nm(S.nuit.victime)}</h3><div class="chips"><button class="chip ${S.tmp.inf===true?'sel':''}" onclick="setT('inf',true)">🩸 Il l'infecte</button><button class="chip ${S.tmp.inf===false?'sel':''}" onclick="setT('inf',false)">Non</button></div>${S.tmp.inf?`<p class="tip">${nm(S.nuit.victime)} ne mourra pas. Plus tard, quand tout le monde dort, touche-lui discrètement l'épaule et chuchote-lui qu'il a été infecté : dès la prochaine nuit, il se réveillera avec la meute.</p>`:''}</div>`+dire("Infect Père des Loups, rendors-toi."),
 next:()=>{if(S.tmp.inf==null)return 'Indique sa décision.';S.infectDit=true;if(S.tmp.inf){const v=P(S.nuit.victime);v.infecte=true;S.infectUsed=true;S.nuit.infecte=v.id;S.nuit.victime=null;log(`L'Infect Père a infecté ${v.nom}.`)}}};

const candGML=()=>vivants().filter(p=>!isLoup(p)&&p.id!==S.nuit.victime&&p.id!==S.nuit.infecte);
ST.n_gml={cond:()=>actif('gml')&&!S.players.some(p=>!p.alive&&isLoup(p))&&candGML().length>0,titre:()=>'Le Grand Méchant Loup',btn:'Valider',
 html:()=>dire(S.gmlDit?"Grand Méchant Loup, réveille-toi. Ta faim n'est pas encore rassasiée… Qui sera ta seconde proie ?":"Grand Méchant Loup, réveille-toi. Ta faim n'est jamais rassasiée… Tant qu'aucun loup de ta meute n'est tombé, tu peux dévorer une seconde victime chaque nuit. Désigne-la.")+
  `<div class="card"><h3>Seconde victime</h3>${picker('v2',{exclude:[...loupsVivants().map(p=>p.id),S.nuit.victime,S.nuit.infecte].filter(x=>x!=null)})}</div>`+dire("Grand Méchant Loup, rendors-toi."),
 next:()=>{if(S.tmp.v2==null)return 'Indique la seconde victime.';S.gmlDit=true;S.nuit.victime2=S.tmp.v2;log(`Le Grand Méchant Loup a désigné ${P(S.tmp.v2).nom}.`)}};

ST.n_sorciere={cond:()=>actif('sorciere')&&(S.witch.vie||S.witch.mort),titre:()=>'La Sorcière',btn:'Valider',
 html:()=>{const s=porteurs('sorciere')[0],V=[S.nuit.victime,S.nuit.victime2].filter(x=>x!=null),v=V[0],sid=s?s.id:S.tmp.sor;let h=dire(n1()?"Sorcière, réveille-toi. Dans ta chaumière au fond des bois, tu as préparé deux potions. L'une, d'un vert lumineux, peut arracher à la mort celui que les Loups ont attaqué. L'autre, noire comme la nuit, peut emporter n'importe quel habitant en un souffle. Chacune ne servira qu'une seule fois. Cette nuit, les Loups-Garous ont attaqué… cette personne.":"Sorcière, réveille-toi. Les Loups ont encore frappé cette nuit… Voici leur victime.");
  h+=s?`<p class="tip">Sorcière : <b>${esc(s.nom)}</b></p>`:`<div class="card"><h3>Qui est la Sorcière ?</h3>${picker('sor',{exclude:pris()})}</div>`;
  h+=`<div class="reveal">👉 Désigne-lui du doigt : <b>${V.length?V.map(nm).join(' et '):'personne'}</b></div><div class="card" style="margin-top:12px"><h3>Potion de vie 💚</h3>`;
  h+=S.witch.vie?dire("Veux-tu verser quelques gouttes de ta potion de vie sur ses lèvres, et l'arracher à la mort ?")+(V.length>1?picker('sv',{list:V.map(P)}):V.length?`<button class="chip ${S.tmp.sv===v?'sel':''}" onclick="pk('sv',${v},false,1)">Oui, elle la sauve</button>`:'<p class="tip">Pas de victime à sauver cette nuit.</p>'):'<p class="tip">Déjà utilisée.</p>';
  h+='</div><div class="card"><h3>Potion de mort ☠️</h3>';
  h+=S.witch.mort?dire("Et ta potion de mort… veux-tu la verser cette nuit dans le verre de quelqu'un ? Si oui, désigne ta cible.")+`<button class="chip ${S.tmp.mo?'sel':''}" onclick="setT('mo',!S.tmp.mo)">Oui, elle empoisonne quelqu'un</button>`+(S.tmp.mo?'<div style="margin-top:12px">'+picker('poi',{exclude:sid!=null?[sid]:[]})+'</div>':''):'<p class="tip">Déjà utilisée.</p>';
  h+='</div><p class="tip">🤫 Ne commente jamais à voix haute ce qu\'elle choisit : tout le village t\'entendrait. Le récit viendra au réveil.</p>';
  return h+dire("Sorcière, range tes fioles… et rendors-toi.")},
 next:()=>{const s=porteurs('sorciere')[0];if(!s&&S.tmp.sor==null)return 'Indique qui est la Sorcière.';if(S.tmp.mo&&S.tmp.poi==null)return 'Choisis la cible de la potion de mort.';
  if(!s)P(S.tmp.sor).role='sorciere';
  if(S.tmp.sv!=null){S.witch.vie=false;S.nuit.sauve=S.tmp.sv;log(`La Sorcière a sauvé ${P(S.tmp.sv).nom}.`)}
  if(S.tmp.mo){S.witch.mort=false;S.nuit.poison=S.tmp.poi;log(`La Sorcière a empoisonné ${P(S.tmp.poi).nom}.`)}}};

const charmables=()=>vivants().filter(p=>!p.charme&&p.role!=='flute');
ST.n_flute={cond:()=>actif('flute')&&charmables().length>0,titre:()=>'Le Joueur de Flûte',btn:'Valider',
 html:()=>{const f=porteurs('flute').find(p=>p.alive),fid=f?f.id:S.tmp.fl;let h=dire(n1()?"Joueur de Flûte, réveille-toi. Rejeté par les villageois comme par les loups, tu ne joues que pour toi. Chaque nuit, ta musique ensorcelante charmera deux joueurs de ton choix. Le jour où tous les survivants du village seront sous ton charme… tu auras gagné, seul contre tous. Désigne les deux joueurs que tu charmes cette nuit.":"Joueur de Flûte, réveille-toi. Quelle mélodie joueras-tu cette nuit ? Désigne deux nouveaux joueurs à charmer.");
  h+=f?`<p class="tip">Joueur de Flûte : <b>${esc(f.nom)}</b></p>`:`<div class="card"><h3>Qui est le Joueur de Flûte ?</h3>${picker('fl',{exclude:pris()})}</div>`;
  const k=Math.min(2,charmables().filter(p=>p.id!==fid).length);
  h+=`<div class="card"><h3>Joueurs charmés (${k})</h3>${picker('chm',{multi:true,max:k,list:charmables().filter(p=>p.id!==fid)})}</div>`;
  return h+dire("Joueur de Flûte, rendors-toi.")},
 next:()=>{const f=porteurs('flute').find(p=>p.alive);if(!f&&S.tmp.fl==null)return 'Indique qui est le Joueur de Flûte.';const fid=f?f.id:S.tmp.fl;
  const k=Math.min(2,charmables().filter(p=>p.id!==fid).length),a=S.tmp.chm||[];if(a.length!==k)return `Choisis ${k} joueur(s) à charmer.`;
  if(!f)P(S.tmp.fl).role='flute';a.forEach(id=>{P(id).charme=true;P(id).nouvCharme=true});log(`Le Joueur de Flûte charme ${a.map(id=>P(id).nom).join(' et ')}.`)}};

ST.n_charmes={cond:()=>S.players.some(p=>p.nouvCharme),titre:()=>'Les charmés',btn:'Continuer',
 html:()=>{const nv=S.players.filter(p=>p.nouvCharme),tous=vivants().filter(p=>p.charme);return dire("Je vais toucher la tête des joueurs que la flûte vient d'ensorceler…")+
  `<div class="card tip">👉 Touche la tête de <b>${nv.map(p=>esc(p.nom)).join('</b> et de <b>')}</b>.<br>Charmés en tout : ${tous.map(p=>esc(p.nom)).join(', ')}</div>`+
  dire("Joueurs charmés, réveillez-vous et reconnaissez-vous. Une étrange mélodie résonne dans votre tête… vous êtes sous le charme du Joueur de Flûte. Charmés, rendormez-vous.")},
 next:()=>{S.players.forEach(p=>delete p.nouvCharme)}};

ST.n_fin={titre:()=>'Fin de la nuit',btn:'☀️ Réveiller le village',
 html:()=>{const m=mortsNuit();let h=`<div class="card"><h3>Résumé (pour toi seul)</h3><p>${m.length?'Mort(s) au réveil : <b>'+m.map(nm).join(', ')+'</b>':'Personne ne meurt cette nuit 🎉'}</p>${S.nuit.sauve!=null?'<p class="tip">💚 La Sorcière a sauvé '+nm(S.nuit.sauve)+'.</p>':''}${[S.nuit.victime,S.nuit.victime2].some(v=>v!=null&&v===S.nuit.protege)?'<p class="tip">🛡️ Le Salvateur a protégé '+nm(S.nuit.protege)+' de l\'attaque.</p>':''}${[S.nuit.victime,S.nuit.victime2].some(v=>attaque(v)&&ancienResiste(v))?'<p class="tip">👴 L\'Ancien résiste à la morsure : il ne meurt pas, mais n\'a plus qu\'une vie.</p>':''}${S.nuit.infecte!=null?'<p class="tip">🩸 '+nm(S.nuit.infecte)+' a été infecté(e) : pense à le prévenir discrètement.</p>':''}</div>`;
  if(n1()){const libres=S.players.filter(p=>!p.role).length,att=['villageois','villvill','ange','servante'].reduce((a,r)=>a+resteN1(r)-porteurs(r).filter(p=>p.alive).length,0);
   h+=`<p class="tip">Les ${libres} joueur(s) non identifié(s) seront notés Simples Villageois. Tu peux corriger un rôle à tout moment via 👥.</p>`;
   if(libres!==att)h+=`<p class="err">⚠️ Incohérence : ${libres} joueur(s) restant(s) pour ${att} carte(s) sans réveil (Villageois, Ange…) en jeu. Vérifie les rôles dans 👥.</p>`}
  return h},
 next:()=>{if(!S.ready){S.players.forEach(p=>{if(!p.role)p.role='villageois'});S.ready=true}startJour();return 'GOTO'}};

ST.d_reveil={cond:()=>S.num>0,titre:()=>'Le village se réveille',btn:'Annoncer les morts',
 html:()=>{const m=mortsNuit();return dire(m.length?`Le jour se lève sur Thiercelieux. Un à un, les villageois ouvrent les yeux… mais certains ne les rouvriront jamais. Cette nuit, la mort a emporté ${m.map(nm).join(' et ')}.`:(S.nuit.sauve!=null||S.nuit.protege!=null&&[S.nuit.victime,S.nuit.victime2].includes(S.nuit.protege)?"Le jour se lève sur Thiercelieux. Les villageois ouvrent les yeux, le cœur battant, et se comptent… Personne ne manque à l'appel ! Pourtant, de profondes traces de griffes marquent l'une des portes, et une étrange odeur d'herbes flotte dans l'air. Cette nuit, quelqu'un est passé tout près de la mort… et une main mystérieuse l'en a arraché.":"Le jour se lève sur Thiercelieux. Les villageois ouvrent les yeux, le cœur battant, et se comptent… Personne ne manque à l'appel !"))+
  `<p class="tip">Ne dis pas comment ils sont morts : chaque mort retourne simplement sa carte.</p>`},
 next:()=>{const n=S.nuit;[n.victime,n.victime2].forEach(v=>{if(attaque(v)&&ancienResiste(v)){S.ancienBlesse=true;log(`L'Ancien (${P(v).nom}) a survécu à la morsure des Loups.`)}});mortsNuit().sort(()=>Math.random()-.5).forEach(id=>enfile(id,causeNuit(id)))}};

ST.d_ange={cond:()=>S.num===0,titre:()=>'Avant la première nuit',btn:'Passer au débat',
 html:()=>dire("Avant que la nuit ne tombe sur Thiercelieux, les villageois se réunissent une première fois sur la place, inquiets. Mais parmi eux s'est glissé un être étrange : un Ange, qui n'a qu'un seul désir… rejoindre le ciel au plus vite. S'il est le premier à mourir, il aura gagné, seul contre tous ! Le village doit donc voter dès maintenant pour éliminer l'un des siens… en se méfiant de ceux qui voudraient un peu trop être choisis.")+

  h+='<div class="card"><h3>Décompte (facultatif)</h3>'+vivants().map(p=>`<div class="row"><span class="grow">${esc(p.nom)}${S.cap===p.id?' ⭐':''}${p.idiotRevele?' <span class="tag">ne vote plus</span>':''}</span><button class="ib" onclick="vt(${p.id},-1)">−</button><b class="cnt">${v[p.id]||0}</b><button class="ib" onclick="vt(${p.id},1)">+</button></div>`).join('');
  if(S.cap!=null&&P(S.cap)&&P(S.cap).alive)h+=`<p class="tip">⭐ Le vote de ${nm(S.cap)} (Capitaine) compte double : ajoute 2 voix à sa cible.</p>`;
  h+=`</div><div class="card"><h3>Joueur éliminé</h3>${picker('elim')}<button class="chip ${S.tmp.elim===-1?'sel':''}" onclick="pk('elim',-1,false,1)">Personne</button>${porteurs('bouc').some(p=>p.alive)?`<button class="chip ${S.tmp.elim===-2?'sel':''}" onclick="pk('elim',-2,false,1)">🐐 Égalité : le Bouc Émissaire meurt</button>`:''}${S.cycle==='jour'&&!S.jugeUsed&&!S.pouvoirsPerdus&&porteurs('juge').some(p=>p.alive)&&S.steps[S.idx]==='d_vote'?`<label class="chk"><input type="checkbox" ${S.tmp.jg?'checked':''} onchange="setT('jg',this.checked)"> ⚖️ Le Juge Bègue a fait son signe : un second vote suivra</label>`:''}<p class="tip">En cas d'égalité : fixe une règle avant la partie et garde-la (souvent : le Capitaine départage, ou on revote entre les ex æquo).</p></div>`;

ST.d_fin={titre:()=>'La nuit approche',btn:'🌙 Passer à la nuit',

function vt(id,d){const v=S.tmp.votes;v[id]=Math.max(0,(v[id]||0)+d);
 const e=Object.entries(v).filter(x=>x[1]>0),mx=Math.max(0,...e.map(x=>x[1])),top=e.filter(x=>x[1]===mx);
 if(mx>0&&top.length===1)S.tmp.elim=+top[0][0];else if(top.length>1)S.tmp.elim=null;save();render()}

function startNuit(n){S.cycle='nuit';S.num=n;S.steps=NUIT;S.idx=0;S.tmp={};S.nuit={victime:null,victime2:null,sauve:null,poison:null,infecte:null,protege:null}}
function startJour(){S.cycle='jour';S.steps=JOUR;S.idx=0;S.tmp={}}
function enfile(id,cause){const p=P(id);if(!p||!p.alive||S.queue.some(q=>q.id===id))return;S.queue.push({id,cause})}

function go(){const st=ST[S.steps[S.idx]],bak=JSON.stringify(S);const r=st.next?st.next():undefined;
 if(typeof r==='string'&&r!=='GOTO'){S=JSON.parse(bak);toast(r);return}
 HIST.push(bak);if(HIST.length>60)HIST.shift();
 if(r!=='GOTO'){S.idx++;S.tmp={}}save();window.scrollTo(0,0);render()}

/* ---------- morts ---------- */
const CAUSES={nuit:'mort(e) cette nuit',loups:'mort(e) cette nuit',poison:'mort(e) cette nuit',vote:'éliminé(e) par le village',chasseur:'abattu(e) par le Chasseur',chagrin:'mort(e) de chagrin',rouille:'mort(e) cette nuit',bouc:'exécuté(e) à la place des autres'};
function partenaire(p){return p.lover?S.players.find(x=>x.lover&&x.id!==p.id):null}
let recit=localStorage.getItem('lgmj_recit')!=='0';
function recitMort(n,c){const fin=` ${n}, retourne ta carte : qui étais-tu vraiment ?`;
 if((c==='loups'||c==='poison'||c==='rouille')&&!recit)c='nuit';
 return {nuit:`Au petit matin, on découvre le corps sans vie de ${n}. La nuit a fait une nouvelle victime…`,
  loups:`À l'aube, on découvre le corps de ${n} au bord du chemin, lacéré de profondes griffures, au milieu d'empreintes énormes. Les Loups-Garous ont encore frappé…`,
  poison:`${n} ne s'est jamais réveillé(e). On l'a retrouvé(e) dans son lit, sans la moindre égratignure, le teint livide et les lèvres noircies… Un poison foudroyant.`,
  vote:`Le village a rendu son verdict. Malgré ses protestations, ${n} est conduit(e) jusqu'au grand chêne de la place, sous le regard de ceux qui furent ses voisins…`,
  chasseur:`Un coup de feu déchire le silence ! ${n} s'effondre, touché(e) par la dernière balle du Chasseur.`,
  rouille:`À l'aube, on découvre ${n} recroquevillé(e) au fond de son lit, brûlant(e) de fièvre, les mâchoires serrées… Une vilaine blessure, rouge de rouille, s'est infectée pendant la nuit.`,
  bouc:`Le village n'arrive pas à se décider… Alors, comme toujours, c'est sur ${n}, le Bouc Émissaire, que tout retombe. On le traîne jusqu'au grand chêne de la place…`,
  chagrin:`En voyant s'éteindre l'être aimé, le cœur de ${n} se brise. Incapable de vivre sans l'autre, ${n} s'effondre à son tour, emporté(e) par le chagrin.`}[c]+fin}
function htmlMort(){const q=S.queue[0],p=P(q.id),r=S.tmp.mr||p.role||'villageois',a=partenaire(p);
 const ex=S.queue.map(x=>x.id);if(a&&a.alive)ex.push(a.id);
 let h=`<div class="entete"><div class="phase">${lib()}</div><h2>☠️ ${esc(p.nom)}</h2></div>`+dire(recitMort(esc(p.nom),q.cause));
 h+=`<div class="card"><h3>Carte révélée</h3><select onchange="setT('mr',this.value)">${ORDER.map(x=>`<option value="${x}" ${x===r?'selected':''}>${rn(x)}</option>`).join('')}</select><p class="tip">Corrige ici si la carte retournée n'est pas celle notée.</p></div>`;
 if(r==='chasseur'&&!S.tmp.sd&&!S.pouvoirsPerdus)h+=dire("Chasseur, tu sens la vie te quitter… mais dans un dernier effort, tu épaules ton fusil. Désigne celui ou celle que tu emportes avec toi dans la tombe.")+`<div class="card"><h3>Cible du Chasseur</h3>${picker('tir',{exclude:S.queue.map(x=>x.id)})}</div>`;
 if(a&&a.alive&&!S.queue.some(x=>x.id===a.id))h+=`<div class="reveal">💔 ${esc(p.nom)} était amoureux(se) de <b>${esc(a.nom)}</b>, qui va mourir de chagrin.</div>`;
 if(S.capitaine&&S.cap===p.id&&vivants().some(x=>!ex.includes(x.id)))h+=dire("Capitaine, avant de rendre ton dernier souffle, tu tends l'insigne du village à celui ou celle qui le guidera après toi. Désigne ton successeur.")+`<div class="card" style="margin-top:12px"><h3>Nouveau Capitaine</h3>${picker('succ',{exclude:ex})}</div>`;

 const servOK=q.cause==='vote'&&!S.pouvoirsPerdus&&!(r==='idiot'&&!p.idiotRevele)&&!S.servanteUsed&&enJeu('servante')>0&&!porteurs('servante').some(x=>!x.alive)&&r!=='servante'&&vivants().length>2;
 if(servOK)h+=dire(`Avant que ${esc(p.nom)} ne retourne sa carte… quelqu'un souhaite-t-il se dévouer ?`)+`<div class="card"><h3>${rn('servante')}</h3><label class="chk"><input type="checkbox" ${S.tmp.sd?'checked':''} onchange="setT('sd',this.checked)"> La Servante se révèle et prend secrètement le rôle de ${esc(p.nom)}</label>${S.tmp.sd?'<div style="margin-top:10px"></div>'+picker('serv',{exclude:[p.id]})+`<p class="tip">Elle montre sa carte Servante, prend celle de ${esc(p.nom)} sans la montrer. ${esc(p.nom)} meurt sans révéler son rôle.</p>`:''}</div>`;
 if(r==='chevalier'&&q.cause==='loups'&&!S.pouvoirsPerdus){const sug=aGauche(p.id);if(S.tmp.rl==null&&sug)S.tmp.rl=sug.id;h+=`<div class="card"><h3>⚔️ L'épée rouillée</h3><p class="tip">Le premier Loup assis à sa gauche${sug?` (d'après l'ordre des prénoms : <b>${esc(sug.nom)}</b>)`:''} mourra au matin de la prochaine nuit. Ne dis rien pour l'instant.</p>${picker('rl',{list:loupsVivants()})}</div>`}
 if(S.modele===p.id){const e=porteurs('enfant').find(x=>x.alive&&!x.sauvage);if(e)h+=`<div class="reveal">🌿 (pour toi seul) ${esc(p.nom)} était le modèle de l'Enfant Sauvage : <b>${esc(e.nom)}</b> rejoint secrètement la meute et se réveillera avec les Loups dès la prochaine nuit.</div>`}
 if(r==='idiot'&&q.cause==='vote'&&!p.idiotRevele&&!S.pouvoirsPerdus)h+=dire(`Au moment où la corde se tend, ${esc(p.nom)} éclate d'un rire niais… C'est l'Idiot du village ! Personne n'a le cœur d'exécuter un simple d'esprit : il est gracié. Mais plus personne n'écoutera son avis : désormais, il ne votera plus.`)+`<div class="reveal">🤪 ${esc(p.nom)} reste en vie, carte visible, mais ne vote plus.</div>`;
 if(r==='ancien'&&['vote','chasseur','poison','bouc'].includes(q.cause)&&!S.pouvoirsPerdus)h+=dire("Le village a mis à mort son Ancien, le gardien de sa mémoire… Accablés de honte, les villageois perdent tous leurs pouvoirs : plus de visions, plus de potions, plus de protection, jusqu'à la fin de la partie.");
 if(q.cause==='bouc'){const ok=vivants().filter(x=>!ex.includes(x.id));h+=dire("Bouc Émissaire, avant de mourir, tu as le dernier mot : désigne ceux qui auront le droit de voter demain.")+`<div class="card"><h3>Votants de demain</h3>${picker('vd',{multi:true,max:ok.length,list:ok})}<p class="tip">Laisse vide pour laisser tout le monde voter.</p></div>`} return h}
function confirmMort(){const q=S.queue[0],p=P(q.id),r=S.tmp.mr||p.role||'villageois',a=partenaire(p);
 const ex=S.queue.map(x=>x.id);if(a&&a.alive)ex.push(a.id);
 if(S.tmp.sd&&S.tmp.serv==null)return toast('Indique qui est la Servante.');
 if(r==='chasseur'&&!S.tmp.sd&&!S.pouvoirsPerdus&&S.tmp.tir==null&&vivants().some(x=>!S.queue.some(y=>y.id===x.id)))return toast('Le Chasseur doit désigner sa cible.');
 if(S.capitaine&&S.cap===p.id&&S.tmp.succ==null&&vivants().some(x=>!ex.includes(x.id)))return toast('Désigne le nouveau Capitaine.');
 if(r==='idiot'&&q.cause==='vote'&&!p.idiotRevele&&!S.pouvoirsPerdus){snap();p.role=r;p.idiotRevele=true;S.queue.shift();log(`${p.nom} est l'Idiot du village : gracié, il ne votera plus.`);S.tmp.mr=null;save();window.scrollTo(0,0);render();return}
 snap();p.role=r;p.alive=false;S.queue.shift();log(`${p.nom} meurt (${CAUSES[q.cause]}) : ${ROLES[r].nom}.`);
 const premiere=!S.premiere;S.premiere=true;
 if(premiere&&r==='ange'){S.phase='fin';S.winner='ange';S.queue=[];log("L'Ange est le premier mort : il gagne !");S.tmp={};save();window.scrollTo(0,0);render();return}
 if(r==='ancien'&&['vote','chasseur','poison','bouc'].includes(q.cause)&&!S.pouvoirsPerdus){S.pouvoirsPerdus=true;log("Le village a tué l'Ancien : les villageois perdent leurs pouvoirs.")}
 if(q.cause==='bouc'){const vd=S.tmp.vd||[];S.votants=vd.length?{num:S.num+1,ids:vd}:null;if(vd.length)log(`Le Bouc Émissaire désigne les votants de demain : ${vd.map(id=>P(id).nom).join(', ')}.`)}
 if(S.tmp.sd){const sv=P(S.tmp.serv);sv.role=r;sv.servi=true;S.servanteUsed=true;if(p.infecte)sv.infecte=false;log(`La Servante Dévouée (${sv.nom}) prend secrètement le rôle de ${p.nom} (${ROLES[r].nom}).`)}
 if(r==='chevalier'&&q.cause==='loups'&&!S.pouvoirsPerdus&&S.tmp.rl!=null){S.rouille={id:S.tmp.rl,nuit:S.num+1};log(`L'épée rouillée a blessé ${P(S.tmp.rl).nom}.`)}
 if(S.modele===p.id){const e=porteurs('enfant').find(x=>x.alive&&!x.sauvage);if(e){e.sauvage=true;log(`L'Enfant Sauvage (${e.nom}) rejoint la meute.`)}}
 if(a&&a.alive)enfile(a.id,'chagrin');
 if(r==='chasseur'&&!S.tmp.sd&&!S.pouvoirsPerdus&&S.tmp.tir!=null){log(`Le Chasseur abat ${P(S.tmp.tir).nom}.`);enfile(S.tmp.tir,'chasseur')}
 if(S.cap===p.id){S.cap=S.tmp.succ!=null?S.tmp.succ:null;if(S.cap!=null)log(`${P(S.cap).nom} devient Capitaine.`)}
 S.tmp.mr=null;S.tmp.tir=null;S.tmp.succ=null;S.tmp.sd=null;S.tmp.serv=null;S.tmp.rl=null;S.tmp.vd=null;save();window.scrollTo(0,0);render()}

function gagnant(){if(!S.ready)return null;const al=vivants();if(!al.length)return 'personne';
 const fl=al.find(p=>p.role==='flute');if(fl&&al.length>1&&al.every(p=>p.id===fl.id||p.charme))return 'flute';
 const am=S.players.filter(p=>p.lover),mixte=am.length===2&&(isLoup(am[0])!==isLoup(am[1]));
 if(mixte&&al.length===2&&al.every(p=>p.lover))return 'amoureux';
 const l=al.filter(isLoup).length;if(!l)return 'village';if(l===al.length)return 'loups';return null}
const WIN={village:['🏡','Le village a gagné !',"Le dernier Loup-Garou est tombé. Pour la première fois depuis bien longtemps, les hurlements se sont tus… Thiercelieux peut enfin dormir en paix. Le village a gagné !"],
 loups:['🐺','Les Loups-Garous ont gagné !',"Le dernier villageois s'est effondré. Il ne reste plus à Thiercelieux que des maisons vides… et des Loups-Garous repus qui hurlent à la pleine lune. Les Loups-Garous ont gagné !"],
 amoureux:['💘','Les Amoureux ont gagné !',"Seuls au milieu du village désert, les deux amoureux se tiennent la main. Ils ont tout sacrifié, trahi les leurs… mais leur amour a survécu à tout. Les Amoureux ont gagné !"],
 ange:['😇',"L'Ange a gagné !","Les cloches sonnent seules dans le clocher de Thiercelieux… L'Ange a obtenu ce qu'il voulait : être le premier à quitter ce monde. Il rejoint le ciel, victorieux, laissant le village à ses loups. L'Ange a gagné !"],
 flute:['🪈','Le Joueur de Flûte a gagné !',"La dernière note s'éteint… Tous les survivants de Thiercelieux marchent derrière le Joueur de Flûte, le regard vide, et disparaissent avec lui dans la brume de la forêt. Le Joueur de Flûte a gagné !"],
 personne:['💀','Personne ne survit…',"Le silence est retombé sur Thiercelieux. Il n'y a plus personne pour raconter ce qui s'est passé ici…"]};

/* ---------- minuteur ---------- */
let T={dur:180,reste:180,run:false,iv:null};
const tm=()=>Math.floor(T.reste/60)+':'+String(T.reste%60).padStart(2,'0');
function htmlTimer(){return `<div class="card"><h3>Minuteur (facultatif)</h3><div id="tm" class="big">${tm()}</div><div class="chips center">${[2,3,5].map(x=>`<button class="chip ${T.dur===x*60?'sel':''}" onclick="tSet(${x})">${x} min</button>`).join('')}<button class="chip" onclick="tGo()">${T.run?'⏸ Pause':'▶ Lancer'}</button><button class="chip" onclick="tSet(T.dur/60)">↺</button></div></div>`}
function tSet(x){clearInterval(T.iv);T={dur:x*60,reste:x*60,run:false,iv:null};render()}
function tGo(){if(T.run){clearInterval(T.iv);T.run=false}else if(T.reste>0){T.run=true;T.iv=setInterval(()=>{T.reste--;const e=$('#tm');if(e)e.textContent=tm();
 if(T.reste<=0){clearInterval(T.iv);T.run=false;if(navigator.vibrate)navigator.vibrate([300,100,300]);render()}},1000)}render()}

/* ---------- préparation ---------- */
function usage(){try{return JSON.parse(localStorage.getItem('lgmj_usage'))||{n:0,last:{}}}catch(e){return {n:0,last:{}}}}
function noterUsage(){const u=usage();u.n++;ORDER.forEach(r=>{if(S.comp[r])u.last[r]=u.n});try{localStorage.setItem('lgmj_usage',JSON.stringify(u))}catch(e){}}
function rng(seed){let a=seed>>>0;return()=>{a=(a+0x6D2B79F5)>>>0;let t=a;t=Math.imul(t^t>>>15,t|1);t^=t+Math.imul(t^t>>>7,t|61);return((t^t>>>14)>>>0)/4294967296}}
function suggest(n){const c={};ORDER.forEach(r=>c[r]=0);c.loup=n<=6?1:n<=11?2:n<=17?3:4;
 if(n>=4)c.voyante=1;if(n>=7)c.sorciere=1;
 let slots=n<=6?1:n<=7?1:n<=9?2:n<=11?3:n<=13?4:n<=15?5:6;
 const U=usage(),R=rng(S.seed||1),ext=extP()||extN();
 const pool=ORDER.filter(r=>dispo(r)&&!['loup','villageois','voyante','sorciere','voleur'].includes(r));
 const sc=r=>(U.last[r]!=null?U.last[r]:-50)+R()*1.5+(ext&&!ROLES[r].et&&!ROLES[r].nl?.8:0)-(ROLES[r].et===S.etape?1.2:0);
 const sorted=pool.map(r=>[r,sc(r)]).sort((a,b)=>a[1]-b[1]).map(x=>x[0]);
 let info=0,solo=0,fort=0,chg=0;
 for(const r of sorted){if(slots<=0)break;const need=r==='soeur'?2:1;if(need>slots)continue;
  if((r==='renard'||r==='montreur')&&info>=(n>=12?2:1))continue;

function addNom(e){e.preventDefault();const i=$('#nn'),v=i.value.trim();if(!v)return;S.noms.push(v);if(!S.compPerso)S.comp=suggest(S.noms.length);save();render();setTimeout(()=>{const x=$('#nn');if(x)x.focus()},0)}

function cp(r,d){if(r==='soeur')d*=2;S.comp[r]=Math.max(0,Math.min(ROLES[r].max,(S.comp[r]||0)+d));S.compPerso=true;save();render()}

  ORDER.filter(r=>dispo(r)||S.comp[r]).map(r=>`<div class="row"><span class="grow" onclick="sheet('aide:${r}')">${rn(r)} <span class="q">ⓘ</span></span><button class="ib" onclick="cp('${r}',-1)">−</button><b class="cnt">${S.comp[r]||0}</b><button class="ib" onclick="cp('${r}',1)">+</button></div>`).join('')+

 h+='</div>';
